    b.onclick = function () {
      ZRSEL = k; store.set("zrSel", ZRSEL);
      ZR_OPEN = false;                 /* choice made — fold the tiles away */
      paintZR();
    };
    tiles.appendChild(b);
  });
  syncSrcOpen();
  ZR = { a:zrFor(ZRSEL).a, b:zrFor(ZRSEL).b, cap:zrFor(ZRSEL).cap };

  document.getElementById("zrA").value = ZR.a.toFixed(1);
  document.getElementById("zrB").value = ZR.b.toFixed(2);
  document.getElementById("zrCap").value = ZR.cap;
  var now = document.getElementById("zrNow");
  var eg = [27.5, 37.5, 47.5].map(function (dz) {
    return dz + "dBZ\u2192" + fmtRate(dbzToRate(dz, undefined));
  }).join("   ");
  now.textContent = "Z = " + ZR.a.toFixed(0) + "\u00b7R^" + ZR.b.toFixed(2)
    + "   \u00b7   " + eg + " mm/h";

  var bar = document.getElementById("zrPresets");
  bar.innerHTML = "";
  Object.keys(ZR_PRESETS).forEach(function (k) {
    var pz = ZR_PRESETS[k], btn = document.createElement("button");
    btn.className = "tool"; btn.textContent = pz.name;
    btn.setAttribute("aria-pressed", Math.abs(ZR.a - pz.a) < 1 && Math.abs(ZR.b - pz.b) < 0.01);
    btn.onclick = function () {
      ZRS[ZRSEL] = { a:pz.a, b:pz.b, cap:ZR.cap };
      saveZR(); paintZR(); render();
    };
    bar.appendChild(btn);
  });

  var h = document.getElementById("zrList"); h.innerHTML = "";
  var P = zrPairs();
  if (!P.length) {
    var e = document.createElement("div");
    e.className = "li"; e.style.color = "var(--dim)"; e.textContent = T("lyrEmpty");
    h.appendChild(e);
  }
  P.forEach(function (pr, i) {
    var d = document.createElement("div"); d.className = "li";
    d.innerHTML = "<span>" + pr.g + " mm/h @ " + pr.d + " dBZ</span>" +
      "<code>" + fmtRate(dbzToRate(pr.d)) + " " + T("mdlRate") + "</code>" +
      "<button class='x' aria-label='remove'>\u00d7</button>";
    d.querySelector(".x").onclick = function () {
      var q = zrPairs(); q.splice(i, 1); setZrPairs(q); paintZR();
    };
    h.appendChild(d);
  });
  var f = fitZR(), t = document.getElementById("zrFit");
  if (!f) {
    t.textContent = T("zrNeed"); t.style.color = "var(--dim)";
  } else {
    t.textContent = "n=" + f.n + "   a=" + f.a.toFixed(0) + "   b=" + f.b.toFixed(2)
      + "   R\u00b2=" + f.r2.toFixed(3) + (f.ok ? "" : "   \u2014 " + T("zrBadFit"));
    t.style.color = f.ok ? "var(--dim)" : "var(--red)";
  }
  document.getElementById("zrDoFit").disabled = !(f && f.ok);
}

/* ══════════════════════════════════════════════════════════════════
   MAP PROBE
   A farmer's first question is "which one is mine". The SVG <title> tooltip
   answers it, but only after a hover delay and not at all under a finger, so
   the reading is mirrored into a line under the card that updates live and
   responds to touch.
   ══════════════════════════════════════════════════════════════════ */
function probeAt(target) {
  var el2 = target;
  while (el2 && el2 !== document && !(el2.getAttribute && el2.getAttribute("data-d"))) {
    el2 = el2.parentNode;
  }
  if (!el2 || !el2.getAttribute) return null;
  var id = +el2.getAttribute("data-d");
  return DIST[id] ? id : null;
}
function eastState(s) {
  return s === "Sabah" || s === "Sarawak" || s.indexOf("Labuan") >= 0;
}

function showProbe(id) {
  var box = document.getElementById("probe");
  if (id == null) {
    /* Idle shows nothing at all. The bar keeps its height on purpose — if it
       collapsed, every hover or tap would shove the roster up and down under
       the reader's finger. */
    box.classList.remove("right");
    box.innerHTML = "";
    return;
  }
  var D = DIST[id], w = wetDistricts()[id], nd = noDataDistricts();
  /* Sabah, Sarawak and Labuan are drawn on the right half of the card.
     Labuan's state string is "W.P. Labuan", so match the same way regionOf
     does rather than by an exact name that would silently miss it. */
  box.classList.toggle("right", eastState(D.state));
  var h = "<span class='r1'><b>" + distName(D) + "</b><span class='met'>";
  if (w) {
    h += "<span class='rn" + (hotRate(w.mm) ? " hot" : "") + "'>" + T("lv")[w.band]
       + (w.mm != null ? " " + (stepCapped(w.step, w.pal) ? "\u2265" : "") + fmtRate(w.mm) + " mm/h" : "")
       + "</span>";
    if (w.mm != null) h += "<span class='st'>" + w.dbz + " dBZ</span>";
    h += "<span class='st'>" + Math.round(w.cov * 100) + "% " + T("covered") + "</span>";
  } else if (nd[id]) {
    h += "<span class='st'>" + T("noData") + "</span>";
  } else if (RADAR) {
    h += "<span class='st'>" + T("lv")[0] + "</span>";
  }
  box.innerHTML = h + "</span></span><span class='r2 st'>" + stateName(D.state) + "</span>";
}
(function () {
  var svg = document.getElementById("bulletin"), last = null;
  function handle(e) {
    var t = e.target;
    if (e.touches && e.touches.length) {
      t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }
    var id = probeAt(t);
    if (id === last) return;
    last = id; showProbe(id);
  }
  svg.addEventListener("mousemove", handle);
  svg.addEventListener("touchstart", handle, { passive:true });
  svg.addEventListener("touchmove", handle, { passive:true });
  svg.addEventListener("mouseleave", function () { last = null; showProbe(null); });
  /* tap the forecast corner to retry or refresh it */
  svg.addEventListener("click", function (e) {
    var r = svg.getBoundingClientRect();
    if (!r.width) return;
    var fx = (e.clientX - r.left) / r.width, fyr = (e.clientY - r.top) / r.height;
    if (fx > 0.62 && fyr > 0.55 && fyr < 0.86 && RADAR) fetchStop(true);
  });
})();

/* Files handed to the app through the system share sheet. The service worker
   parked them in a cache and bounced us here; pick them up, hand them to the
   normal intake, and tidy the URL so a reload does not re-import. Android and
   desktop Chrome only — iOS has no share_target — so this is a no-op there. */
async function collectShared() {
  if (location.search.indexOf("shared=1") < 0) return;
  try {
    var cache = await caches.open("rbmy-share");
    var head = await cache.match("./__shared/count");
    var n = head ? parseInt(await head.text(), 10) : 0;
    var files = [];
    for (var i = 0; i < n; i++) {
      var res = await cache.match("./__shared/" + i);
      if (!res) continue;
      var blob = await res.blob();
      var shot = +(res.headers.get("x-shot") || 0);
      files.push(new File([blob], "shared-" + i + ".png",
        { type:blob.type || "image/png", lastModified:shot || Date.now() }));
    }
    var keys = await cache.keys();
    await Promise.all(keys.map(function (k) { return cache.delete(k); }));
    if (files.length) {
      paintAnchorSel();
      var dlg = document.getElementById("cal");
      if (!dlg.open) dlg.showModal();
      enqueueFiles(files);
    }
  } catch (e) { /* nothing shared, or no cache access */ }
  history.replaceState(null, "", location.pathname);
}

/* ══════════════════════════════════════════════════════════════════
   WHEN WILL IT STOP
   The one thing a farmer asks that radar alone cannot answer. This is the
   only network call the app makes, and it is a FORECAST — everything else on
   the card is observed radar, so it is labelled separately and never merged
   into the rain figures.

   Rate limiting, in layers, because the set of raining farms changes every
   time a screenshot is pasted:
     1. one HTTP call, however many farms — Open-Meteo takes up to 1000
        coordinate pairs in a single request
     2. coordinates rounded to ~1 km and de-duplicated before asking
     3. answers cached against that coordinate set for 15 minutes
     4. a hard floor of 4 minutes between calls whatever else happens
     5. a self-imposed daily budget of 200 calls against a limit of 10,000
     6. three consecutive failures and it stops trying until the next paste
     7. never on a timer — only when a layer is added or the line is tapped
   ══════════════════════════════════════════════════════════════════ */
var OM_URL = "https://api.open-meteo.com/v1/forecast";
var OM_TTL = 15 * 60 * 1000;        /* an answer stays good this long */
var OM_FLOOR = 4 * 60 * 1000;       /* never call more often than this */
var OM_BUDGET = 200;                /* per day, against a 10,000 limit */
var OM_MAXPTS = 60;

var STOP = { state:"idle", range:null, west:null, east:null, wOn:null, eOn:null,
             wPk:null, ePk:null, at:0, key:"", fails:0, n:0, src:"dist" };

function omBudget() {
  var today = new Date().toISOString().slice(0, 10);
  var b = store.get("omBudget", { d:"", n:0 });
  if (b.d !== today) b = { d:today, n:0 };
  return b;
}
function omSpend() {
  var b = omBudget(); b.n++; store.set("omBudget", b); return b.n;
}

/* Where to ask. Wet FARMS first, since those are the people who care — but on
   a typical bulletin none of the 114 happen to sit under the rain, so fall
   back to the wet districts themselves, which is what the map is showing.
   Rounded to ~1 km and de-duplicated so the cache key is stable. */
function stopPoints() {
  if (!RADAR) return [];
  var seen = {}, out = [];
  function add(la, lo, obs) {
    la = Math.round(la * 100) / 100; lo = Math.round(lo * 100) / 100;
    var k = la + "," + lo;
    if (seen[k]) return;
    /* obs = what the RADAR says is falling there right now, in mm/h, or null
       when the source gives no rates. Carried so the forecast can be checked
       against the observation instead of silently overruling it. */
    /* Which side of the country: the 109E meridian sits in the South China
       Sea between the two, so it separates them without touching either. */
    seen[k] = 1; out.push({ la:la, lo:lo, east:lo >= 109, obs:(obs == null ? null : obs) });
  }
  liveFavs().forEach(function (f) {
    var pi = pointInfo(f.la, f.lo);
    if (pi.seen && pi.step) add(f.la, f.lo, pi.mm);
  });
  STOP.src = out.length ? "fav" : "dist";
  if (!out.length) {
    var wet = wetDistricts();
    Object.keys(wet)
      .sort(function (a, b) { return wet[b].step - wet[a].step; })
      .forEach(function (k) { add(DIST[k].cen[1], DIST[k].cen[0], wet[k].mm); });
  }
  /* Starred favourites are asked about even when dry, so a farm that is not
     raining yet still gets a heads-up. Starred only, and after the wet points:
     the cap is a real limit, and a place already raining has the stronger
     claim on it. */
  var wetN = out.length;
  liveFavs().forEach(function (f) {
    if (f.st) add(f.la, f.lo);
  });
  out.forEach(function (p, i) { p.watch = i >= wetN; });
  return out.slice(0, OM_MAXPTS);
}

/* Malaysia has one timezone and no daylight saving, so the bulletin is always
   stamped in MYT regardless of where the phone thinks it is. */
var MYT = "Asia/Kuala_Lumpur";
function mytClock(ms) {
  try {
    return new Date(ms).toLocaleTimeString("en-GB",
      { timeZone:MYT, hour:"2-digit", minute:"2-digit", hour12:false });
  } catch (e) {
    var d = new Date(ms + 8 * 3600000);        /* MYT is UTC+8, fixed */
    return String(d.getUTCHours()).padStart(2, "0") + ":"
         + String(d.getUTCMinutes()).padStart(2, "0");
  }
}

/* The line this bulletin exists for. Nobody broadcasts a drizzle: these cards
   go out for the storms MET Malaysia would put a thunderstorm warning against,
   so the forecast answers "when does the heavy rain ease", not "when does the
   last drop fall". STOP_MM therefore sits on the same moderate-rain line as
   the 速览 panel (QUICK_MM) — one definition of real rain across the app.

   It also removes a known bias: IFS at 9km smooths convection and trails light
   precipitation for hours after a cell has passed, so a 0.1mm test kept the
   clock running long past anything a farmer would call rain.

   ECMWF reports precipitation as the SUM OVER THE PRECEDING HOUR, so a value
   stamped 14:00 covers 13:00-14:00 — the rain eased somewhere inside that
   window, and 14:00 is the conservative end of it. Two consecutive hours below
   the line are required, so a lull inside a storm is not read as its end.

   Times come back as unix seconds; asking for local strings would have them
   parsed against the device clock, which is wrong the moment the phone is not
   on Malaysian time. Returns an absolute instant, not a countdown. */
var STOP_MM = QUICK_MM;              /* 2.5 mm/h — the work-stopping line */

/* Intensity vocabulary, calibrated on the ground rather than from a textbook.
   Stanley's own experience of these rates in Malaysia:
     2.5   workers stop and look for shelter  (also the 速览 line)
     4     medium to heavy
     7     surely heavy rain
     8+    leaning towards thunderstorm
   Above that MET Malaysia's own bar applies: their thunderstorm warning is
   issued for rain intensity exceeding 20 mm/h (met.gov.my, thunderstorm
   warning criteria), a short-period warning of up to 6 hours per issue.
   WMO would call 2.5-10 "moderate", but a farmer sheltering under a shed does
   not care what Geneva calls it — the words follow the local meaning, and the
   card names the rate it is actually talking about instead of saying "heavy"
   for everything above the line. */
function rainWord(mm) {
  if (mm == null) return T("fcRain");
  if (mm >= 20) return T("fcStorm");        /* MET thunderstorm criterion */
  if (mm >= 7)  return T("fcHeavy");
  if (mm >= 4)  return T("fcModHeavy");
  return T("fcMod");
}

/* The strongest hour still ahead, so the label can name the right intensity. */
function peakAt(times, vals) {
  var now = Date.now(), pk = null;
  for (var i = 0; i < vals.length; i++) {
    var t = (+times[i]) * 1000;
    if (!isFinite(t) || t < now) continue;
    var v = vals[i] || 0;
    if (pk === null || v > pk) pk = v;
  }
  return pk;
}
var NO_HEAVY = -1;                   /* nothing above the line in the window */

/* Ask when the heavy rain eases only AFTER establishing that heavy rain is
   forecast at all. Without that gate, a day of light drizzle satisfies "two
   hours below 2.5" at the very first hour, and the card announces heavy rain
   easing when none was ever coming — which is exactly what it did on a
   0.93 mm/h afternoon. Three outcomes, all distinct:
     NO_HEAVY  nothing above the line ahead  → say so, do not invent a time
     null      above the line to the horizon → "continuing for hours"
     timestamp the hour it drops and stays below  */
/* When heavy rain ARRIVES. The easing search already had to find this hour;
   it was computed and thrown away. Reported separately because its confidence
   is different in kind: for a place already raining, radar proves the event
   exists and the model only has to end it. For a dry place the model has to
   CREATE convection in the right spot at the right hour, and IFS at 9km
   smooths exactly the cells that matter — an hour or three of timing error is
   normal. Hence the hedged wording in the label. */
function wetAt(times, vals) {
  var now = Date.now();
  for (var i = 0; i < vals.length; i++) {
    var t = (+times[i]) * 1000;
    if (!isFinite(t) || t < now) continue;
    if ((vals[i] || 0) >= STOP_MM) return t;
  }
  return null;
}

function dryAt(times, vals) {
  var now = Date.now();
  var start = -1;
  for (var i = 0; i < vals.length; i++) {
    var t0 = (+times[i]) * 1000;
    if (!isFinite(t0) || t0 < now) continue;
    if ((vals[i] || 0) >= STOP_MM) { start = i; break; }
  }
  if (start < 0) return NO_HEAVY;
  for (var j = start; j < vals.length - 1; j++) {
    var t = (+times[j]) * 1000;
    if (!isFinite(t)) continue;
    if ((vals[j] || 0) < STOP_MM && (vals[j+1] || 0) < STOP_MM) return t;
  }
  return null;                       /* heavy rain past the horizon */
}

function fetchStop(manual) {
  var pts = stopPoints();
  if (!pts.length) {
    /* Clear EVERY field, not just range. The per-region windows and onsets
       added in 4.34-4.37 survived this reset; nothing renders them while the
       state is idle, so it is latent rather than visible — but a half-cleared
       object is exactly what turns into a stale-data bug on the next change. */
    STOP.state = "idle"; STOP.range = null; STOP.n = 0;
    STOP.west = null; STOP.east = null; STOP.wOn = null; STOP.eOn = null;
    STOP.wPk = null; STOP.ePk = null;
    return;
  }
  var key = pts.map(function (p) { return p.la + "," + p.lo; }).join(";");

  if (STOP.key === key && STOP.state === "ok" && Date.now() - STOP.at < OM_TTL) return;
  if (!manual && STOP.state === "loading") return;
  if (STOP.fails >= 3 && !manual) return;
  if (!navigator.onLine) { STOP.state = "offline"; drawBulletin(); return; }
  if (Date.now() - (store.get("omLast", 0)) < OM_FLOOR && !manual) return;
  if (omBudget().n >= OM_BUDGET) { STOP.state = "budget"; drawBulletin(); return; }

  STOP.state = "loading"; STOP.key = key; STOP.n = pts.length;
  drawBulletin();
  store.set("omLast", Date.now());
  omSpend();

  /* ECMWF IFS HRES at 9 km, named explicitly rather than letting best_match
     pick. 1-hourly out to 90 hours, which is the finest step any global model
     offers here — AIFS is 6-hourly and cannot answer this question at all.
     15-minute data is NOT requested: outside Central Europe and North America
     Open-Meteo interpolates it from the hourly fields, so it would have been
     invented precision. */
  var q = OM_URL
    + "?latitude=" + pts.map(function (p) { return p.la; }).join(",")
    + "&longitude=" + pts.map(function (p) { return p.lo; }).join(",")
    + "&hourly=precipitation&models=ecmwf_ifs&forecast_days=2"
    + "&timeformat=unixtime&timezone=GMT";

  var ctl = ("AbortController" in window) ? new AbortController() : null;
  if (ctl) setTimeout(function () { ctl.abort(); }, 12000);

  fetch(q, ctl ? { signal:ctl.signal } : undefined)
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (j) {
      var arr = Array.isArray(j) ? j : [j], ends = [];
      var side = [], starts = [], peaks = [];
      arr.forEach(function (o, i) {
        var m = o && o.hourly;
        if (!m || !m.time) return;
        ends.push(dryAt(m.time, m.precipitation || []));
        starts.push(wetAt(m.time, m.precipitation || []));
        peaks.push(peakAt(m.time, m.precipitation || []));
        side.push(pts[i] && pts[i].east ? "east" : "west");
      });
      if (!ends.length) throw new Error("empty");   /* no data is a failure, not a forecast */
      /* A window per region, because one line covering both was misleading:
         30 districts raining in Johor AND Sarawak read as "16:00-20:00", which
         looks like seven hours of rain in one place when it is really one
         region clearing mid-afternoon and the other in the evening. */
      /* THE RADAR WINS. He only pastes an image when something is coming down
         hard, so a point the radar shows at or above the line is raining
         heavily — full stop. When the model's own hour disagrees and offers no
         heavy hour ahead, that is the model already ending a storm the image
         proves is happening: it is not evidence of calm, and the card must
         never answer "no heavy rain forecast" over a wet radar pixel. Such a
         point is counted as easing at the model's first hour and flagged, so
         the wording can admit the disagreement instead of hiding it. */
      function rangeOf(pick) {
        var k = [], total = 0, calm = 0, argued = 0, firstHr = null;
        ends.forEach(function (v, i) {
          if (side[i] !== pick) return;
          total++;
          var wetNow = pts[i] && pts[i].obs != null && pts[i].obs >= STOP_MM;
          if (v === NO_HEAVY) {
            if (wetNow) {                     /* radar says otherwise */
              argued++;
              if (starts[i]) k.push(starts[i]);
              else if (firstHr != null) k.push(firstHr);
            } else calm++;
            return;
          }
          if (v !== null) { k.push(v); if (firstHr === null) firstHr = v; }
        });
        if (!total) return null;
        if (calm === total) return { calm:true, n:total };
        if (!k.length) return argued ? { soon:true, argued:argued, n:total } : null;
        return { lo:Math.min.apply(null, k), hi:Math.max.apply(null, k),
                 all:k.length === total - calm, n:total, argued:argued };
      }
      /* The earliest arrival in each region, counting only points that are not
         already in heavy rain — telling someone rain "arrives" when it is
         already falling on them is noise. */
      function onsetOf(pick) {
        var soon = null;
        starts.forEach(function (v, i) {
          if (side[i] !== pick || v === null) return;
          if (ends[i] !== NO_HEAVY && v <= Date.now() + 20 * 60 * 1000) return;
          if (soon === null || v < soon) soon = v;
        });
        return soon;
      }
      var known = ends.filter(function (v) { return v !== null && v !== NO_HEAVY; });
      STOP.state = "ok"; STOP.at = Date.now(); STOP.fails = 0;
      STOP.west = rangeOf("west");
      STOP.east = rangeOf("east");
      STOP.wOn = onsetOf("west");
      STOP.eOn = onsetOf("east");
      /* The heaviest hour each region still faces, radar included: he only
         pastes during real rain, so an observed rate above the model's own
         peak is the truer number to name. */
      function peakOf(pick) {
        var pk = null;
        peaks.forEach(function (v, i) {
          if (side[i] !== pick || v == null) return;
          if (pk === null || v > pk) pk = v;
        });
        pts.forEach(function (p, i) {
          if ((p.east ? "east" : "west") !== pick || p.obs == null) return;
          if (pk === null || p.obs > pk) pk = p.obs;
        });
        return pk;
      }
      STOP.wPk = peakOf("west");
      STOP.ePk = peakOf("east");
      STOP.range = known.length
        ? { lo:Math.min.apply(null, known), hi:Math.max.apply(null, known),
            all:known.length === ends.length }
        : null;
      drawBulletin();
    })
    .catch(function () {
      STOP.fails++; STOP.state = "fail"; STOP.key = "";
      drawBulletin();
    });
}

/* A clock time, not a countdown. The bulletin is forwarded and read minutes or
   hours later, and "in 45 minutes" is wrong by then while "by 09:00" is not.
   The model steps hourly, so the answer is stated on the hour — quarter hours
   would dress up an interpolation as a measurement. */
function q15(ms) { return Math.ceil(ms / (60 * 60000)) * (60 * 60000); }
function stopWord() {
  if (STOP.state === "loading") return { t:T("stopWait"), dim:true };
  if (STOP.state === "offline") return { t:T("stopOffline"), dim:true };
  if (STOP.state === "budget" || STOP.state === "fail") return null;
  if (STOP.state !== "ok") return null;
  var cw = STOP.west && STOP.west.calm, ce = STOP.east && STOP.east.calm;
  /* "Coming" is a different statement from "easing", so it gets its own
     clause and its own hedge — 可能 / likely, never 预计. A place with rain
     on the way matters more than one with nothing forecast, so this is
     reported ahead of the all-calm line. */
  /* One template, the intensity word filled from the peak hour ahead. */
  function say(key, mm) { return T(key).replace("{w}", rainWord(mm)); }
  function comingLine() {
    var parts = [];
    if (STOP.wOn && STOP.eOn) {
      parts.push(T("vPen") + " " + mytClock(q15(STOP.wOn)));
      parts.push(T("vBor") + " " + mytClock(q15(STOP.eOn)));
    } else {
      var only = STOP.wOn || STOP.eOn;
      if (only) parts.push(mytClock(q15(only)));
    }
    var pk = STOP.wOn && STOP.eOn ? Math.max(STOP.wPk || 0, STOP.ePk || 0)
           : (STOP.wOn ? STOP.wPk : STOP.ePk);
    return parts.length ? say("stopComing", pk) + " " + parts.join("  \u00b7  ") : null;
  }
  var argued = (STOP.west && STOP.west.argued) || (STOP.east && STOP.east.argued);
  /* Only regions with a real time window can be printed as one. */
  var wWin = (STOP.west && !STOP.west.calm && !STOP.west.soon) ? STOP.west : null;
  var eWin = (STOP.east && !STOP.east.calm && !STOP.east.soon) ? STOP.east : null;
  /* Radar shows heavy rain and the model offers no heavy hour anywhere: say so
     outright. "Continuing for hours" would overstate it (the model expects the
     opposite) and "no heavy rain" would deny the image he just pasted. */
  if (argued && !wWin && !eWin) return { t:T("stopArgue"), dim:false };
  if (!argued && (cw || !STOP.west) && (ce || !STOP.east) && (cw || ce)) {
    var coming = comingLine();
    return coming ? { t:coming, dim:false } : { t:T("stopNoHeavy"), dim:true };
  }
  function win(r) {
    var a = mytClock(q15(r.lo)), b = mytClock(q15(r.hi));
    return (a === b ? a : a + "\u2013" + b) + (r.all ? "" : "+");
  }
  /* Name the region only when both are raining — labelling a single region
     "Peninsular" adds a word that carries no information. */
  if (wWin && eWin) {
    return { t:say("stopBy", Math.max(STOP.wPk || 0, STOP.ePk || 0))
                + " " + T("vPen") + " " + win(wWin)
                + "  \u00b7  " + T("vBor") + " " + win(eWin), dim:false };
  }
  /* Pick the region that actually HAS a window — a calm region has no lo/hi,
     and feeding it to win() printed "Invalid Date" on exactly the case the
     previous release added: one region easing while the other waits for rain. */
  var only = wWin || eWin;
  /* Nothing resolves anywhere: the rain runs past the forecast horizon. */
  var pk = (only === STOP.east) ? STOP.ePk
         : (only === STOP.west) ? STOP.wPk
         : Math.max(STOP.wPk || 0, STOP.ePk || 0) || null;
  if (!only && !STOP.range) return { t:say("stopBeyond", pk), dim:false };
  var base = say("stopBy", pk) + " " + win(only || STOP.range);
  /* Some points in this bulletin have radar and model disagreeing; the time
     above comes from the model, so mark whose word is being reported. */
  if (argued) base += "  \u00b7  " + T("stopArgued");
  /* one region easing while the other is still to be hit */
  var other = (cw ? STOP.wOn : ce ? STOP.eOn : null);
  if (other) base += "  \u00b7  " + say("stopComing", cw ? STOP.wPk : STOP.ePk) + " "
                   + T(cw ? "vPen" : "vBor") + " " + mytClock(q15(other));
  return { t:base, dim:false };
}

   the field has none. Reads every image on the clipboard, so both the

document.getElementById("calPaste").onclick = function () {
  if (!(navigator.clipboard && navigator.clipboard.read)) {
    toast(T("pasteNoApi")); return;
  }
  navigator.clipboard.read().then(function (items) {
    var jobs = [];
    items.forEach(function (item) {
      item.types.forEach(function (t) {
        if (t.indexOf("image/") === 0) jobs.push(item.getType(t));
      });
    });
    if (!jobs.length) { toast(T("pasteNone")); return; }
    Promise.all(jobs).then(function (blobs) {
      var files = blobs.map(function (b, i) {
        return new File([b], "clipboard-" + (i + 1) + ".png", { type:b.type || "image/png" });

/* align-mode gestures: drag pans, pinch or wheel zooms. Registered before
   the anchor handlers so, in align mode, these take the pointer and stop the
   event; anchor placement never sees it. */
(function () {
  var cv = document.getElementById("calCv"), PTRS = {};
  function halt(e) { e.stopImmediatePropagation(); e.preventDefault(); }
  function kx() { var r = cv.getBoundingClientRect(); return cv.width / r.width; }
  cv.addEventListener("pointerdown", function (e) {
    if (!ALIGN || !IMGC) return;
    halt(e);
    PTRS[e.pointerId] = { x:e.clientX, y:e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointermove", function (e) {
    if (!ALIGN || !IMGC) return;
    halt(e);
    if (!(e.pointerId in PTRS)) return;
    var kimg = kx() * (IMGC.width / document.getElementById("calCv").width);
    var ids = Object.keys(PTRS);
    if (ids.length === 1) {
      var p = PTRS[e.pointerId];
      alignPan((e.clientX - p.x) * kimg, (e.clientY - p.y) * kimg);
      p.x = e.clientX; p.y = e.clientY;
    } else if (ids.length === 2) {
      var a = PTRS[ids[0]], b = PTRS[ids[1]];
      var before = Math.hypot(a.x - b.x, a.y - b.y);
      PTRS[e.pointerId] = { x:e.clientX, y:e.clientY };
      var a2 = PTRS[ids[0]], b2 = PTRS[ids[1]];
      var after = Math.hypot(a2.x - b2.x, a2.y - b2.y);
      if (before > 4 && after > 4) {
        var r = cv.getBoundingClientRect();
        var mx = ((a2.x + b2.x) / 2 - r.left) * kimg;
        var my = ((a2.y + b2.y) / 2 - r.top) * kimg;
        alignZoom(after / before, mx, my);
      }
    }
  });
  ["pointerup", "pointercancel"].forEach(function (ev) {
    cv.addEventListener(ev, function (e) {
      if (!ALIGN) return;
      halt(e);
      delete PTRS[e.pointerId];
    });
  });
  cv.addEventListener("wheel", function (e) {
    if (!ALIGN || !IMGC) return;
    halt(e);
    var r = cv.getBoundingClientRect();
    var kimg = kx() * (IMGC.width / cv.width);
    alignZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1,
              (e.clientX - r.left) * kimg, (e.clientY - r.top) * kimg);
  }, { passive:false });
})();

/* tap to place an anchor, with a loupe for precision */
(function () {
  var cv = document.getElementById("calCv");
  cv.addEventListener("pointerdown", function (e) {
    if (!IMGC) return;
    DRAG = true; cv.setPointerCapture(e.pointerId);
    drawLoupe(evtToImg(e)); e.preventDefault();
  });
  cv.addEventListener("pointermove", function (e) {
    if (!DRAG || !IMGC) return;
    drawLoupe(evtToImg(e)); e.preventDefault();
  });
  cv.addEventListener("pointerup", function (e) {
    if (!DRAG || !IMGC) return;
    DRAG = false;
    document.getElementById("loupe").style.display = "none";
    commitAnchor(evtToImg(e));
  });
  cv.addEventListener("pointercancel", function () {
    DRAG = false; document.getElementById("loupe").style.display = "none";
  });
})();

/* PWA — registers only when actually served over http(s) */
/* ══ update checking ═══════════════════════════════════════════════
   A PWA only re-checks its worker on navigation, so a session left open all
   morning never notices a new build. This asks again whenever the app comes
   back to the foreground — throttled, because on iOS every glance at another
   app and back fires that event.

   It NEVER reloads by itself. Swapping the code out from under someone who is
   mid-paste, or halfway through a WhatsApp preview at 5:15am, would be a
   worse bug than being one version behind. It tells him instead, and the
   reload happens when he taps. */
var SWREG = null, SWASK = 0, SWNEW = false;
function swCheck() {
  if (!SWREG || Date.now() - SWASK < 60000) return;
  SWASK = Date.now();
  try { SWREG.update().catch(function () {}); } catch (e) {}
}
function swAnnounce() {
  if (SWNEW) return;
  SWNEW = true;
  var t = document.getElementById("toast");
  t.style.cursor = "pointer";
  t.onclick = function () { location.reload(); };
  toast(T("swNew"));
  try { render(); } catch (e) {}      /* redraw the stamp with the marker */
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  try {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      SWREG = reg;
      if (reg.waiting && navigator.serviceWorker.controller) swAnnounce();
      reg.addEventListener("updatefound", function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", function () {
          /* "installed" with a controller already present means this is an
             update, not the first install */
          if (nw.state === "installed" && navigator.serviceWorker.controller) swAnnounce();
        });
      });
    }).catch(function () {});
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) swCheck();
    });
    window.addEventListener("online", swCheck);
  } catch (e) {}
}
