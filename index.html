<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<link rel="manifest" href="./manifest.json">
<!-- Without these the browser probes /favicon.ico and logs a 404 on every load;
     GitHub Pages has no such file and the app already ships an SVG icon. -->
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>雨情 · RainBulletin</title>
<style>
/* ── tokens ─────────────────────────────────────────────
   ink      #101014   bulletin text / hairlines
   paper    #ffffff   bulletin ground (JMM white)
   jmm      #2323c8   MetMalaysia warning blue
   slate    #0f1020   app chrome (instrument housing)
   steel    #1c1e33   panel
   amber    #f0a92c   staleness / attention
   ───────────────────────────────────────────────────── */
:root{
  --ink:#101014; --paper:#fff; --jmm:#2323c8; --slate:#0f1020; --steel:#191c30;
  --line:#2b3050; --amber:#f0a92c; --red:#d9433f; --dim:#a6acce; --text:#f2f4ff;
  --r0:#c9d2f5; --r1:#8e9deb; --r2:#5061dc; --r3:#2323c8; --r4:#14148c;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--slate); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom);
  font-weight:450; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
.wrap{max-width:1120px;margin:0 auto;padding:14px 12px 48px}

/* ── masthead ── */
.mast{margin:4px 2px 14px}
.mastrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mast h1{
  font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  margin:0;color:var(--text)
}
/* 雨情 sets optically smaller than RAINBULLETIN at the same point size —
   Han glyphs fill their em box, so uppercase Latin at 17px looks taller than
   CJK at 17px. Bumped so the two mastheads read at the same visual weight. */
.mast .zh{font-size:22px;letter-spacing:.24em;font-weight:700}
.mast .zh .lat{letter-spacing:.04em;font-size:19px}
.mast .sub{display:block;margin-top:5px;font-family:var(--mono);font-size:12px;
  font-weight:500;color:var(--dim);letter-spacing:.05em}
.spacer{flex:1}
.langbtn{
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;
  background:var(--steel);color:var(--text);
  border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer
}
.langbtn:hover{border-color:#3d4470}
@media(max-width:640px){
  /* a 44px target, and legible at arm's length in daylight */
  .langbtn{font-size:15px;padding:9px 15px;min-height:44px;border-radius:6px}
}

/* ── bulletin card (the signature) ── */
.card{background:var(--paper);border-radius:3px;overflow:hidden;box-shadow:0 1px 0 #000,0 10px 34px -14px #000}
#bulletin{display:block;width:100%;height:auto;touch-action:manipulation}
#bulletin text{font-family:var(--sans)}

/* ── map probe: which district is under the finger ── */
/* --ink is the near-black used on the white bulletin card; this strip sits on
   the dark page, so it needs --text or the district name is black on black. */
/* Always two rows, whatever the content: district and readings on top, state
   beneath. A bar that changes shape as you drag across the map is distracting
   — and its height must not change either, or the roster below shifts under
   the reader's finger. */
.probe{margin:8px 0 0;padding:7px 11px;min-height:52px;font-size:13.5px;font-weight:500;
  color:var(--dim);font-family:var(--mono);letter-spacing:.02em;background:var(--steel);
  border:1px solid var(--line);border-radius:3px;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
/* Line one never wraps. Left-aligned it happened to fit; right-aligned, a
   long name like "Bukit Mabong" pushed the readings onto their own line and
   the bar grew to three. The readings hold their width and the district name
   yields first, since a clipped name is still recognisable while a wrapped
   row breaks the whole layout. */
.probe .r1{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap;min-width:0}
.probe .r2{line-height:1.2}
/* Right-aligned means the NAME sits at the right edge, directly above the
   state — justify-content alone did nothing once the row filled the width,
   so the order reverses instead: readings first, district last. */
.probe.right .r1{flex-direction:row-reverse}
.probe.right .r2{text-align:right}
.probe b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.probe .met{display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap;flex:0 0 auto;
  white-space:nowrap}
.probe b{color:var(--text);font-family:var(--sans);font-weight:700;letter-spacing:0;
  font-size:14.5px}
.probe .st{color:var(--dim);font-size:12px}
.probe .rn{color:#8ea2ff;font-weight:700}
/* One red, used only for rates at or above HOT_MM — if it appeared anywhere
   else it would stop meaning "look at this". */
.hot{color:#ff5b52 !important;font-weight:800}
#quick .qmm.hot{color:#ff5b52 !important}
.tag.hot{color:#ff5b52;font-weight:800}
@media(max-width:520px){
  /* the readings must fit beside the name on one line, so they get a notch
     smaller on a phone rather than being allowed to wrap */
  .probe{font-size:11.5px}
  .probe b{font-size:13.5px}
  .probe .st{font-size:11px}
  .probe .r1{gap:9px}
  .probe .met{gap:8px}
}
/* The readout follows the side of the map that was touched. On a phone the
   map is small, so people pinch-zoom the page; zoomed into Borneo the viewport
   shows the right of the page and a left-aligned readout sits off-screen
   entirely. Right-aligning it for East Malaysia keeps it in view. */
.probe.right{justify-content:flex-end;text-align:right}

/* ── toolbar ── */
/* Desktop keeps one flowing row; the phone gets a keypad — three rows of three
   equal tiles, thumb-sized, so nothing reflows unpredictably as labels change
   length between Chinese and English. */
.bar{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 18px;align-items:center}
.brow{display:contents}
button.tool{
  font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.05em;
  background:var(--steel);color:var(--text);border:1px solid var(--line);
  border-radius:2px;padding:8px 12px;cursor:pointer
}
button.tool:hover{border-color:#454d80}
button.tool[aria-pressed="true"]{background:var(--jmm);border-color:var(--jmm);color:#fff}
button.tool.go{background:var(--jmm);border-color:var(--jmm);color:#fff;font-weight:600}
button.tool.wa{background:#25d366;border-color:#25d366;color:#07231a;font-weight:700}
#quickWrap[hidden]{display:none}
#credBody[hidden]{display:none}
#credGuide{margin:2px 0 16px}
#credGuide h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--mono);color:var(--dim);font-weight:500}
#credGuide ol{margin:0;padding:0;list-style:none;counter-reset:g}
#credGuide ol li{counter-increment:g;position:relative;padding:0 0 9px 26px;font-size:13px;line-height:1.5}
#credGuide ol li::before{content:counter(g);position:absolute;left:0;top:1px;width:18px;height:18px;
  border-radius:9px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
#credGuide ol li b{color:var(--text);font-weight:700}
#credGuide ol li span{color:var(--dim)}
#credGuide ul{margin:4px 0 0;padding-left:16px;list-style:none}
#credGuide ul li{position:relative;padding:0 0 5px 0;font-size:12.5px;color:var(--dim);line-height:1.5}
#credGuide ul li::before{content:"\00b7";position:absolute;left:-12px;color:var(--dim)}
#quick{border:1px solid var(--line);border-radius:3px;background:#0d0f1c;padding:4px 0;margin-bottom:6px}
#quick .qst{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;
  padding:7px 11px 3px;border-top:1px solid var(--line)}
#quick .qst:first-child{border-top:0}
/* Names were truncated to one cramped line. The place gets its own column and
   wraps freely; the rate keeps its own, bigger and never wrapping. */
#quick .qrow{display:flex;align-items:flex-start;gap:12px;padding:9px 12px}
#quick .qwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#quick .qn{font-size:14px;font-weight:700;line-height:1.32;overflow-wrap:anywhere}
#quick .qd{color:var(--dim);font-size:12px;font-family:var(--mono);letter-spacing:.03em}
#quick .qmm{font-family:var(--mono);font-weight:700;white-space:nowrap;
  font-size:14.5px;padding-top:1px}
#quick .qnone{padding:10px 11px;color:var(--dim);font-size:12.5px}
.fgrp{border-bottom:1px solid var(--line)}
.fgrp:last-child{border-bottom:0}
.fghead{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;
  background:none;border:0;cursor:pointer;color:var(--text);font-family:var(--sans);
  font-size:12.5px;font-weight:700;letter-spacing:.05em;text-align:left}
.fghead .caret{font-family:var(--mono);color:var(--dim);width:9px;
  transition:transform .12s ease;display:inline-block}
.fghead .fgn{flex:1;min-width:0}
.fghead em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;
  color:#cfd6f5;letter-spacing:.04em}
.wapre{background:#0d0f1c;border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:10px;
  max-height:44vh;overflow:auto;text-align:center}
.wapre img{max-width:100%;height:auto;display:block;margin:0 auto}
#waTxt{min-height:150px;line-height:1.5}
button.tool.wa:hover{background:#31e074;border-color:#31e074}
button.tool:disabled{opacity:.4;cursor:default}
button.tool:focus-visible,.langbtn:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── roster ── */
h2.sec{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:500;margin:26px 2px 10px;
  border-bottom:1px solid var(--line);padding-bottom:7px
}
.state{margin-bottom:16px}
.state>h3{
  font-size:12.5px;font-weight:700;letter-spacing:.06em;margin:0 0 6px;color:#fff;
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  padding:5px 0
}
.state>h3 .caret{
  display:inline-block;font-family:var(--mono);color:var(--dim);
  transition:transform .12s ease;transform:rotate(0deg);width:9px
}
.state.open>h3 .caret{transform:rotate(90deg)}
.state .grows{display:none}
.state.open .grows{display:block}
.state>h3 em{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:700;
  color:#cfd6f5;letter-spacing:.04em}
.state>h3 em.wet{color:#fff;background:var(--r3);border-radius:8px;padding:1px 7px}
.row{
  display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--steel);
  margin-bottom:5px
}
.row.on{border-color:#3a44a8;background:#181d3f}
.chip{width:14px;height:14px;border-radius:3px;background:#2a2f4a;border:1px solid #0a0c18}
.nm{min-width:0}
.nm b{font-weight:600;font-size:14px;display:block;line-height:1.25}
.nm span{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.mm{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.mm small{display:block;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.04em}
.tag{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em;
  padding:4px 8px;border-radius:3px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap
}
.tag.rain{background:var(--jmm);border-color:var(--jmm);color:#fff}
.star{background:none;border:0;cursor:pointer;font-size:15px;line-height:1;padding:0 6px 0 0;
  color:#4a4f70;filter:grayscale(1) opacity(.5)}
.star.on{filter:none}
.binhead{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--dim);
  margin:0 0 6px;text-transform:uppercase}
#fBin .li span{color:var(--dim)}
.state.starred h3{color:#f5c23a}
.state.starred{border-left:2px solid #f5c23a;padding-left:9px;margin-left:-11px}
.li .nmstar{color:#e0a02a;margin-right:5px}
.row.near .tag{color:#8ea2ff;background:#171b30;border-color:#2a2f4a}
.tag.storm{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
.empty{
  border:1px dashed var(--line);border-radius:2px;padding:22px 16px;text-align:center;
  color:var(--dim);font-size:13.5px
}

/* ── editor ── */
dialog{
  border:1px solid var(--line);background:var(--steel);color:var(--text);border-radius:3px;
  padding:0;width:min(560px,94vw);max-height:86vh
}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
.dlg{padding:20px 20px 18px}
/* Vertical rhythm: rows breathe at 14px, a section heading opens with 22px
   above it, and the hint under a row hugs that row (6px) instead of floating
   between two of them — the dialog read as one dense block before. */
.dlg h3{margin:0 0 14px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);color:var(--dim);font-weight:500}
.dlg h3 + .fld{margin-top:2px}
.dlg .fld + .fld{margin-top:2px}
.dlg .hint{margin:6px 0 14px}
.dlg .fld ~ h3{margin-top:22px}
.dlg .list{margin-top:4px}
.fld{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;margin-bottom:14px}
.fld label,.fld .lab{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--dim);letter-spacing:.06em}
input,textarea,select{
  width:100%;background:#0d0f1c;border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:7px 9px;font-family:var(--mono);font-size:12.5px
}

/* Radar-source picker: the native dropdown as collapsible tiles that expand
   inline. The amber 已载入 badge replaces the bare white dot that used to mark
   a source whose palette is attached to a currently pasted image. */
.srcpick{width:100%}
button.srchead{
  width:100%;display:flex;align-items:center;gap:8px;
  background:#0d0f1c;border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:8px 9px;font-family:var(--mono);font-size:12.5px;
  cursor:pointer;text-align:left
}
button.srchead:hover{border-color:#454d80}
button.srchead .caret{margin-left:auto;color:var(--dim);transition:transform .12s ease}
button.srchead[aria-expanded="true"] .caret{transform:rotate(90deg)}
.srctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px;margin-top:8px}
.srctiles[hidden]{display:none}
button.srctile{
  background:var(--steel);border:1px solid var(--line);color:var(--text);
  border-radius:4px;padding:8px 7px;font-family:var(--mono);font-size:12px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:40px
}
button.srctile:hover{border-color:#454d80}
button.srctile[aria-pressed="true"]{background:var(--jmm);border-color:var(--jmm);color:#fff}
.srcpick .on{font-size:10.5px;color:var(--amber);letter-spacing:.04em}
/* iOS zooms the page whenever a focused field is under 16px. Nothing else
   stops it — not viewport flags, not user-scalable. Meet the threshold. */
@media(max-width:640px){
  input,textarea,select{font-size:16px;padding:9px 10px}
}
textarea{min-height:150px;line-height:1.45;resize:vertical}
.hint{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--dim);
  line-height:1.6;margin:8px 0 0}
.list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:2px;margin-top:10px}
.li{display:flex;align-items:center;gap:8px;padding:8px 9px;border-bottom:1px solid #232744;font-size:13.5px}
.li:last-child{border-bottom:0}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li code{font-family:var(--mono);font-size:11px;color:var(--dim)}
.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.foot{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.drop{border:1px dashed var(--line);border-radius:2px;padding:30px 14px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
.drop.over{border-color:var(--jmm);color:var(--text);background:#141833}
/* touch-action:none meant a finger anywhere on the preview was captured, so a
   tall phone screenshot became a scroll trap. pan-y lets a vertical drag scroll
   the dialog while a tap still places an anchor, and the rails either side give
   a guaranteed place to swipe. */
.cvwrap{position:relative;margin-bottom:10px}
#calCv{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:2px;
  touch-action:pan-y;cursor:crosshair;background:#0d0f1c}
/* Invisible rails laid OVER the map rather than insetting it — the preview
   keeps the full width, and a thumb landing near either edge scrolls the
   dialog instead of dropping an anchor. */
.rail{display:none}
@media(max-width:640px){
  .rail{display:block;position:absolute;top:0;bottom:0;width:14%;
    touch-action:pan-y;background:transparent;z-index:3}
  .rail.l{left:0} .rail.r{right:0}
}
.loupe{position:fixed;width:132px;height:132px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;box-shadow:0 8px 26px -8px #000;pointer-events:none;display:none;z-index:200}
.loupe canvas{display:block;width:132px;height:132px}
select{width:100%;background:#0d0f1c;border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:7px 9px;font-family:var(--mono);font-size:12.5px}
dialog#cal{width:min(940px,96vw)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;
  background:#fff;color:#101014;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  padding:9px 16px;border-radius:2px;box-shadow:0 8px 30px -8px #000;opacity:0;pointer-events:none;
  transition:opacity .18s
}
.toast.show{opacity:1}
@media(max-width:640px){
  /* Only the main toolbar becomes a keypad. The little option bars inside the
     dialogs — sensitivity, Z-R presets, timestamp — are a different thing and
     were inheriting full-width 62px tiles, which stacked them into a column. */
  .bar.keypad{display:block;margin:11px 0 16px}
  .brow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px}
  .brow .spacer{display:none}
  .brow.wa3{grid-template-columns:repeat(3,1fr)}
  .fld .bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .fld .bar button.tool{
    width:100%;height:auto;min-height:40px;padding:8px 4px;font-size:12px;
    line-height:1.2;border-radius:5px;
    display:flex;align-items:center;justify-content:center;text-align:center
  }
  /* ~116 x 62 at 380px, ~133 x 62 at 430px — close to a Nokia keypad key and
     a comfortable thumb target either way. Every tile the same: "Sabah &
     Sarawak" wraps to two lines and used to make its whole row taller. */
  .bar.keypad button.tool{
    width:100%;height:62px;padding:6px 5px;font-size:12.5px;line-height:1.25;
    display:flex;align-items:center;justify-content:center;text-align:center;
    border-radius:6px;overflow:hidden
  }
}
@media(max-width:520px){
  .wrap{padding:12px 9px 40px}
  .nm span{font-size:12px}
  .tag{font-size:11.5px}
  .hint{font-size:12px}
  .mast h1{font-size:15px}
  .mast h1.zh{font-size:20px;letter-spacing:.16em}
  .mast .sub{font-size:11.5px;letter-spacing:.04em}
  .row{grid-template-columns:12px 1fr auto;gap:8px}
  .fld{grid-template-columns:1fr;gap:6px;margin-bottom:16px}
  .dlg{padding:16px 14px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <div class="mastrow">
      <h1 class="zh" data-i="brandZh">雨情 Lab</h1>
      <h1 class="en" data-i="brandEn" hidden>RAINBULLETIN Lab</h1>
      <span class="spacer"></span>
      <button class="langbtn" id="lang">EN</button>
    </div>
    <span class="sub" data-i="tagline">降雨县属着色</span>
  </div>

  <div class="card"><svg id="bulletin" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="probe" id="probe" aria-live="polite"></div>

  <div class="bar keypad">
    <div class="brow view">
      <button class="tool" id="vAll"  aria-pressed="true"  data-i="vAll">全国</button>
      <button class="tool" id="vPen"  aria-pressed="false" data-i="vPen">半岛</button>
      <button class="tool" id="vBor"  aria-pressed="false" data-i="vBor">东马</button>
      <span class="spacer"></span>
    </div>
    <div class="brow">
      <button class="tool" id="copy" data-i="btnCopy">复制文字</button>

   雨情 RainBulletin — single-file offline-first PWA
   Districts: 160 × Malaysia ADM2, TopoJSON quantised in-file (no CDN)

var NS            = "rainbulletin-my";
/* ══════════════════════════════════════════════════════════════════
   雨情 RainBulletin MY — MAINTENANCE MAP

   Alarm radar screenshot; the app georeferences it, reprojects onto 160
   Malaysia ADM2 districts, and renders the morning bulletin card he
   broadcasts on WhatsApp.

   RELEASE CHECKLIST (every publish, no exceptions)
   1. Bump CACHE_VERSION here AND in sw.js — they must match.
   2. node --check the extracted script (build.py does this).
   3. Run the regression suites; every one green before shipping.
   4. Ship four files together: index.html, sw.js, manifest.json, icon.svg.

   · i18n tables ......... T(), zh/en dictionaries (mixed UTF-8 + \uXXXX —
                           always grep the exact current bytes before editing)
   · solveCal/wmx/wmy .... web-mercator maths; cal = {A,Bx,By}: imgPx = A·w+B
   · PALETTES / ZRS ...... radar colour ladders and Z-R relations per source
   · detectSource ........ which app took the capture, read from its legend's

var ARCS = null;      // decoded [lon,lat] polylines
var ARCKIND = null;   // 2 = coastline, 1 = state border, 0 = district border
var DIST = (function () {
  var tr = TOPO.transform, sx = tr.scale[0], sy = tr.scale[1], tx = tr.translate[0], ty = tr.translate[1];
  var arcs = TOPO.arcs.map(function (a) {
    var x = 0, y = 0, out = [];
    for (var i = 0; i < a.length; i++) { x += a[i][0]; y += a[i][1]; out.push([x*sx+tx, y*sy+ty]); }
    return out;
  });
  ARCS = arcs;

  /* An arc used by one ring only is a coastline; an arc shared by districts in
     two different states is a state border. Costs nothing extra to store. */
  var meta = arcs.map(function () { return { n:0, st:{} }; });
  TOPO.objects.districts.geometries.forEach(function (g) {
    (g.type === "Polygon" ? [g.arcs] : g.arcs).forEach(function (p) {
      p.forEach(function (r) {
        r.forEach(function (k) {
          var m = meta[k < 0 ? ~k : k]; m.n++; m.st[g.properties.state_name] = 1;
        });
      });
    });
  });
  ARCKIND = meta.map(function (m) {
    if (m.n <= 1) return 2;
    return Object.keys(m.st).length > 1 ? 1 : 0;
  });

  function ring(idx) {
    var out = [];
    for (var i = 0; i < idx.length; i++) {
      var k = idx[i], a = k < 0 ? arcs[~k].slice().reverse() : arcs[k];
      if (!out.length) out = a.slice(); else out = out.concat(a.slice(1));
    }
    return out;
  }
  return TOPO.objects.districts.geometries.map(function (g, n) {
    var polys = (g.type === "Polygon" ? [g.arcs] : g.arcs).map(function (p) { return p.map(ring); });
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, cx=0, cy=0, np=0;
    polys.forEach(function (p) { p[0].forEach(function (pt) {
      if(pt[0]<x0)x0=pt[0]; if(pt[0]>x1)x1=pt[0]; if(pt[1]<y0)y0=pt[1]; if(pt[1]>y1)y1=pt[1];
      cx+=pt[0]; cy+=pt[1]; np++;
    }); });
    return { id:n, name:g.properties.name, state:g.properties.state_name,
             polys:polys, bbox:[x0,y0,x1,y1], cen:[cx/np, cy/np] };
  });
})();

function wetDistricts() {
  var m = {};
  if (!RADAR) return m;
  RADAR.cells.forEach(function (t, i) {
    if (t.inn === 0 || t.echo === 0) return;
    var need = t.inn <= 6 ? 1 : 2;
    if (t.echo < need) return;
    var cov = t.echo / t.inn;
    if (cov < WET_MIN_COV && t.echo < WET_MIN_CELLS) return;
    var st = districtStep(t);
    var rated = !!t.pal;                    /* this district's own layer */
    m[i] = { band:rated ? stepBand(st, t.pal) : (GEN_BAND[st] || 1), step:st, cov:cov, d:DIST[i],
             dbz:stepDbz(st), pal:t.pal,
             /* districtRate() reports the ramp's own rates at the same top-15%
                percentile the step uses, so the pair stays consistent. */
             mm:rated ? Math.round((rampPal(t.pal) ? (districtRate(t) || stepRate(st, t.pal))
                                                   : stepRate(st, t.pal)) * 100) / 100 : null };
  });
  return m;
}

/* districts no pasted image reaches */
function noDataDistricts() {
  var m = {};
  if (RADAR) RADAR.cells.forEach(function (t, i) { if (t.inn === 0) m[i] = 1; });
  return m;
}

function watchedDistricts() {
  var m = {};
  liveFavs().forEach(function (f) { var d = districtAt(f.lo, f.la); if (d) m[d.id] = 1; });
  return m;
}

/* The map shades every district holding an echo, however faint. The roll-call
   must not — a single trace cell is not news, and naming a hundred districts
   makes the bulletin useless. Named districts need light rain or better, or a
   fifth of their area wet. */
var ROLL_MAX = 40;
var STATE_N = (function () {
  var m = {};
  DIST.forEach(function (D) { m[D.state] = (m[D.state] || 0) + 1; });
  return m;
})();
function rollCall() {
  var wet = wetDistricts(), keep = [];
  Object.keys(wet).forEach(function (k) {
    var w = wet[k];
    if (w.band >= 2 || (w.cov != null && w.cov >= 0.20)) keep.push(w);
  });
  keep.sort(function (a, b) { return b.band - a.band || (b.cov || 0) - (a.cov || 0); });
  var more = 0;
  if (keep.length > ROLL_MAX) { more = keep.length - ROLL_MAX; keep = keep.slice(0, ROLL_MAX); }
  var byState = {};
  keep.forEach(function (w) { (byState[w.d.state] = byState[w.d.state] || []).push(w.d); });
  var out = Object.keys(byState).sort().map(function (s) {
    var all = byState[s].length === STATE_N[s];
    /* sort on the English name so the order is stable across languages,
       then print whichever language is active */
    return { state:stateName(s), dists:all ? null : byState[s]
      .sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; })
      .map(distName) };
  });
  out.more = more;
  return out;
}

function drawBulletin() {
  var svg = document.getElementById("bulletin");
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  var W = 1060, HEAD = 74, MAP = 400;
  var roll = rollCall();

  // measure the footer roll-call so the card grows to fit it
  var footLines = buildFootLines(roll, W - 40);
  var offs = offshoreLine();
  var FOOT = 40 + footLines.length * 19 + 16 + (offs ? 19 : 0);
  var H = HEAD + MAP + FOOT;

  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.appendChild(el("rect", { x:0, y:0, width:W, height:H, fill:"#ffffff" }));

  var wet = wetDistricts(), watched = watchedDistricts(), nd = noDataDistricts();
  /* With both halves pasted the whole country is covered, so there is nothing
     to hatch and nothing to explain — drop the pattern and its legend entry. */
  var gapN = 0;
  for (var g0 in nd) gapN++;
  var hasGap = gapN > 0;

  var defs = el("defs", {});
  /* The peninsular view fits by height, so the canvas reaches far wider east
     than the view box asks for — wide enough to catch western Sarawak. Clip
     the map band so nothing can spill past the frame it was fitted to. */
  var clip = el("clipPath", { id:"mapclip" });
  clip.appendChild(el("rect", { x:0, y:HEAD, width:W, height:MAP }));
  defs.appendChild(clip);
  if (hasGap) {
    /* explicit diagonals rather than patternTransform — rasterises everywhere */
    var pat = el("pattern", { id:"nodata", width:8, height:8, patternUnits:"userSpaceOnUse" });
    pat.appendChild(el("rect", { width:8, height:8, fill:"#ffffff" }));
    pat.appendChild(el("path", { d:"M0 8L8 0M-2 2L2 -2M6 10L10 6",
      stroke:"#bcbfd0", "stroke-width":1.8 }));
    defs.appendChild(pat);
  }
  svg.appendChild(defs);

  /* ── header ── */
  var h1 = el("text", { x:22, y:31, "font-size":18, "font-weight":800, "letter-spacing":"0.5", fill:"#101014" });
  h1.textContent = T("bTitle"); svg.appendChild(h1);
  var h2 = el("text", { x:22, y:52, "font-size":12, "font-weight":500, fill:"#5b6076", "letter-spacing":"0.6" });
  h2.textContent = T("srcRadar"); svg.appendChild(h2);
  var t1 = el("text", { x:W-22, y:31, "font-size":11.5, "text-anchor":"end", fill:"#5b6076" });
  t1.textContent = new Date().toLocaleDateString(LANG === "zh" ? "zh-Hans" : "en-GB",
    { year:"numeric", month:"short", day:"numeric" });
  svg.appendChild(t1);
  var t2 = el("text", { x:W-22, y:50, "font-size":11.5, "text-anchor":"end", fill:"#5b6076" });
  if (RADAR) {
    var nWet = 0;
    for (var kk in wet) nWet++;
    var ts1 = el("tspan", { "font-weight":700, fill:"#101014" });
    ts1.textContent = nWet + " " + T("wetCount") + "  \u00b7  ";
    t2.appendChild(ts1);
    var ts2 = el("tspan", {});
    ts2.textContent = T("radarAt") + RADAR.label;
    t2.appendChild(ts2);
    /* staleness used to live in the status row; it has to keep a home somewhere,
       and the recipients of a broadcast are exactly who needs to see it */
    var age = Date.now() - oldestLayer();
    if (age > STALE_MS) {
      var ts3 = el("tspan", { fill:"#b8700c", "font-weight":700 });
      ts3.textContent = "  \u00b7  " + T("stale") + " " + Math.round(age / 60000) + "m";
      t2.appendChild(ts3);
    }
  } else {
    t2.textContent = T("noImg");
  }
  svg.appendChild(t2);
  svg.appendChild(el("line", { x1:22, y1:HEAD-10, x2:W-22, y2:HEAD-10, stroke:"#101014", "stroke-width":1.4 }));

  /* ── map ── */
  var g = el("g", { "clip-path":"url(#mapclip)" }); svg.appendChild(g);
  var P = makeProj(VIEWS[VIEW], W, MAP, 14);
  var proj = function (lon, lat) { var q = P(lon, lat); return [q[0], q[1] + HEAD]; };
  var vb = VIEWS[VIEW], PAD = 0.3;
  function inView(b) {
    return b[2] >= vb[0] - PAD && b[0] <= vb[2] + PAD &&
           b[3] >= vb[1] - PAD && b[1] <= vb[3] + PAD;
  }

  DIST.forEach(function (D) {
    if (!inView(D.bbox)) return;
    var w = wet[D.id];
    var fill = w ? LEVELS[w.band].fill
             : nd[D.id] ? "url(#nodata)"
             : watched[D.id] ? "#ffffff" : "#f4f4f7";
    var p = el("path", { d: pathFor(D, proj), fill: fill, stroke:"none" });
    p.setAttribute("data-d", D.id);
    var lbl = distName(D) + ", " + stateName(D.state)
      + (w ? " \u2014 " + T("lv")[w.band]
             + (w.mm != null ? " \u00b7 " + (stepCapped(w.step, w.pal) ? "\u2265" : "")
                 + fmtRate(w.mm) + " mm/h \u00b7 " + w.dbz + " dBZ" : "")
             + " (" + Math.round(w.cov * 100) + "% " + T("covered") + ")"
           : nd[D.id] ? " \u2014 " + T("noData") : "");
    p.setAttribute("aria-label", lbl);
    g.appendChild(p);
  });

  /* boundary overlay — district hairline, state medium, coastline heaviest */
  var buckets = ["", "", ""];
  for (var a = 0; a < ARCS.length; a++) {
    var pts = ARCS[a], seg = "";
    var ax0 = 1e9, ay0 = 1e9, ax1 = -1e9, ay1 = -1e9;
    for (var q3 = 0; q3 < pts.length; q3++) {
      if (pts[q3][0] < ax0) ax0 = pts[q3][0];
      if (pts[q3][0] > ax1) ax1 = pts[q3][0];
      if (pts[q3][1] < ay0) ay0 = pts[q3][1];
      if (pts[q3][1] > ay1) ay1 = pts[q3][1];
    }
    if (!inView([ax0, ay0, ax1, ay1])) continue;
    for (var i = 0; i < pts.length; i++) {
      var q = proj(pts[i][0], pts[i][1]);
      seg += (i ? "L" : "M") + (Math.round(q[0]*10)/10) + " " + (Math.round(q[1]*10)/10);
    }
    buckets[ARCKIND[a]] += seg;
  }
  [[0, 0.3, "#5d6178"], [1, 0.85, "#101014"], [2, 1.15, "#101014"]].forEach(function (b) {
    if (!buckets[b[0]]) return;
    g.appendChild(el("path", { d:buckets[b[0]], fill:"none", stroke:b[2],
      "stroke-width":b[1], "stroke-linejoin":"round", "stroke-linecap":"round" }));
  });

  /* favourite pins */
  var starred = [];
  /* Grouping puts some farms in two lists at once — the Bentong sites appear
     under both the area and the team — so several entries share one coordinate.
     One pin per place on the map; the roster still lists every entry, and they
     read identically because the rain is sampled from the same point. */
  var seenPt = {};
  liveFavs().forEach(function (f) {
    /* Clipping only stops overflow past the band edge; a Sabah pin still lands
       well inside it. Favourites need the same view filter the districts get. */
    if (!inView([f.lo, f.la, f.lo, f.la])) return;
    var key = f.la.toFixed(5) + "," + f.lo.toFixed(5);
    var mates = coincident(key);
    var anyStar = mates.some(function (m) { return m.st; });
    if (!PINS && !anyStar) return;            /* starred farms stay pinned */
    if (seenPt[key]) return;                  /* one dot per place */
    seenPt[key] = 1;
    var r = { fav:f };
    var q = proj(r.fav.lo, r.fav.la);
    if (q[0] < 4 || q[0] > W-4 || q[1] < HEAD || q[1] > HEAD+MAP) return;
    var wetPt = RADAR ? bandAtPoint(r.fav.la, r.fav.lo) > 0 : false;
    if (anyStar) {
      /* Deferred, not drawn here: a dot for a farm later in the list would
         paint straight over it. Stars go down after every plain dot. */
      starred.push({ f:mates.filter(function (m) { return m.st; })[0] || f, q:q,
                     extra:mates.length - 1, wet:wetPt });
      return;
    }
    g.appendChild(el("circle", { cx:q[0], cy:q[1], r:3.6,
      fill:wetPt?"#ffffff":"#101014",
      stroke:wetPt?"#101014":"#ffffff", "stroke-width":1.2 }));
  });

  /* A gold ring is invisible among a hundred dots, so a starred farm is NAMED
     on the map. That is the whole point of the star: this is the one a farmer
     is looking for. Labels are drawn last so nothing paints over them, with a
     white halo so they hold up against any district fill. */
  /* An actual star, not a ring — it has to be findable at a glance among a
     hundred plain dots, and it is what the user asked for by name. */
  starred.forEach(function (o) {
    g.appendChild(el("path", { d:starPath(o.q[0], o.q[1], 9.5, 4.2),
      fill:"#f5c23a", stroke:"#101014", "stroke-width":1.3,
      "stroke-linejoin":"round" }));
    if (o.wet) {
      g.appendChild(el("circle", { cx:o.q[0], cy:o.q[1], r:2.6, fill:"#101014" }));
    }
  });

  starred.sort(function (a, b) { return a.q[1] - b.q[1]; });
  var placed = [];
  starred.forEach(function (o) {
    var name = shortFarm(o.f.n) + (o.extra ? " +" + o.extra : "");
    var wpx = name.length * 5.9 + 10;
    var right = o.q[0] + wpx + 12 < W - 8;
    var tx = right ? o.q[0] + 10 : o.q[0] - 10;
    var ty = o.q[1] + 3.6;
    /* nudge down until this label clears the ones already placed */
    for (var guard = 0; guard < 14; guard++) {
      var clash = placed.some(function (pz) {
        return Math.abs(pz.y - ty) < 11 && Math.abs(pz.x - tx) < (wpx + pz.w) * 0.5;
      });
      if (!clash) break;
      ty += 11;
    }
    placed.push({ x:tx, y:ty, w:wpx });
    var t = el("text", { x:tx, y:ty, "font-size":10.5, "font-weight":700,
      "text-anchor": right ? "start" : "end", fill:"#101014",
      stroke:"#ffffff", "stroke-width":3, "paint-order":"stroke" });
    t.textContent = name;
    g.appendChild(t);
  });

  /* Bottom-right of the map: the forecast, kept visually apart from the
     observed figures and always carrying the word "forecast". */
  var sw = stopWord();
  if (sw) {
    /* Was too faint, too long, and sat almost on the divider. The word
       "Forecast" plus the model name says everything the old four-clause
       line said; the timestamp stays because a forecast without its issue
       time is a guess. Lifted clear of the rule and darkened a step. */
    var sy = HEAD + MAP - 22;
    var st1 = el("text", { x:W - 22, y:sy, "font-size":12, "text-anchor":"end",
      fill:sw.dim ? "#8a8e9e" : "#101014", "font-weight":sw.dim ? 400 : 700 });
    st1.textContent = sw.t;
    svg.appendChild(st1);
    var st2 = el("text", { x:W - 22, y:sy + 13, "font-size":10,
      "text-anchor":"end", fill:"#585d70" });
    st2.textContent = "ECMWF IFS 9km " + T("stopNote")
      + (STOP.at ? " \u00b7 " + mytClock(STOP.at) + " MYT" : "");
    svg.appendChild(st2);
  }

  /* ── footer ── */
  var fy = HEAD + MAP + 14;
  svg.appendChild(el("line", { x1:22, y1:fy-6, x2:W-22, y2:fy-6, stroke:"#101014", "stroke-width":1.4 }));
  svg.appendChild(el("rect", { x:22, y:fy+3, width:13, height:15, fill:"#2323c8" }));
  var lg = el("text", { x:42, y:fy+15, "font-size":13.5, "font-weight":700, fill:"#101014" });
  lg.textContent = T("bLegend"); svg.appendChild(lg);

  // intensity ramp, right-aligned
  var rx = W - 22 - 5*26;
  LEVELS.slice(1).forEach(function (L, i) {
    svg.appendChild(el("rect", { x:rx+i*26, y:fy+4, width:24, height:13, fill:L.fill, stroke:"#101014", "stroke-width":0.5 }));
  });
  var sc = el("text", { x:rx-8, y:fy+15, "font-size":10, "text-anchor":"end", fill:"#5b6076" });
  sc.textContent = T("obs") + (RADAR && RADAR.rates ? "  \u00b7  mm/h" : "") + "  \u00b7  " + T("listMin");
  svg.appendChild(sc);

  if (hasGap) {
    svg.appendChild(el("rect", { x:190, y:fy+3, width:13, height:15,
      fill:"url(#nodata)", stroke:"#101014", "stroke-width":0.5 }));
    var ndl = el("text", { x:210, y:fy+15, "font-size":11.5, fill:"#5b6076" });
    ndl.textContent = T("noData") + " (" + gapN + ")"; svg.appendChild(ndl);
  }

  if (offs) {
    var ot = el("text", { x:22, y:fy + 40 + footLines.length * 19 + 6,
      "font-size":12, fill:"#5b6076" });
    var ob = el("tspan", { "font-weight":700 });
    ob.textContent = T("offshore") + " ";
    ot.appendChild(ob);
    var oc = el("tspan", {});
    oc.textContent = offs;
    ot.appendChild(oc);
    svg.appendChild(ot);
  }
  footLines.forEach(function (line, i) {
    var t = el("text", { x:22, y:fy + 40 + i*19, "font-size":13.5, fill:"#101014" });
    line.forEach(function (seg) {
      var ts = el("tspan", { "font-weight": seg.b ? 700 : 400 });
      ts.textContent = seg.t; t.appendChild(ts);
    });
    svg.appendChild(t);
  });
}

/* word-wrap the roll-call into bold-state / plain-district runs */
function buildFootLines(roll, maxW) {
  if (!roll.length) return [[{ t:(RADAR ? T("bNone") : T("noImg")), b:false }]];
  var segs = [];
  roll.forEach(function (r, i) {
    if (i) segs.push({ t:" • ", b:true });
    segs.push({ t:r.state, b:true });
    if (r.dists) segs.push({ t:" (" + r.dists.join(", ") + ")", b:false });
  });
  if (roll.more) segs.push({ t:"  … +" + roll.more + " " + T("more"), b:true });
  // approximate width: 7.2px per CJK char, 6.4 bold / 6.0 plain per latin char at 13.5px
  function w(s, b) {
    var n = 0;
    for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) > 255 ? 13.5 : (b ? 7.2 : 6.6);
    return n;
  }
  var lines = [[]], cur = 0;
  segs.forEach(function (seg) {
    /* split AFTER any of space/comma/bullet/paren, keeping the delimiter on
       the preceding chunk — same as the lookbehind split this replaces, which
       was a parse error (a dead app, not a fallback) on WebKit < iOS 16.4 */
    var words = [], acc2 = "";
    for (var wi = 0; wi < seg.t.length; wi++) {
      acc2 += seg.t.charAt(wi);
      if (" ,\u2022(".indexOf(seg.t.charAt(wi)) >= 0) { words.push(acc2); acc2 = ""; }
    }
    if (acc2) words.push(acc2);
    var buf = "";
    words.forEach(function (word) {
      var ww = w(word, seg.b);
      if (cur + ww > maxW && buf.trim()) {
        lines[lines.length-1].push({ t:buf, b:seg.b }); lines.push([]); cur = 0; buf = word.replace(/^\s+/, "");
        cur = w(buf, seg.b);
      } else { buf += word; cur += ww; }
    });
    if (buf) lines[lines.length-1].push({ t:buf, b:seg.b });
  });
  return lines;
}

/* ══ roster ══ */
function render() {
  drawBulletin();
  var host = document.getElementById("roster");
  host.innerHTML = "";
  if (!liveFavs().length) { host.innerHTML = '<div class="empty">' + T("noFav") + '</div>'; return; }

  var wetD = wetDistricts();
  var rows = liveFavs().map(function (f) {
    var dd = districtAt(f.lo, f.la);
    var pi = RADAR ? pointInfo(f.la, f.lo) : null;
    /* If the farm itself reads dry but its district is wet, say so rather than
       leaving the roster flatly contradicting the shaded map. */
    return { fav:f, dist:dd, pi:pi,
             rb:pi ? (pi.seen ? pi.band : -1) : null,
             dw:dd ? wetD[dd.id] : null };
  });
  /* Every seed is a favourite, so "favourite" no longer distinguishes anything.
     The star marks the ones being watched today — they get their own section at
     the top and are lifted out of the state list, not repeated in both. */
  var groups = [];
  var starRows = rows.filter(function (r) { return r.fav.st; });
  if (starRows.length) {
    groups.push({ key:"\u2605", label:T("starred"), rows:starRows, star:true });
  }
  var byState = {};
  rows.forEach(function (r) {
    if (r.fav.st) return;
    var s2 = r.dist ? r.dist.state : "\u2014";
    (byState[s2] = byState[s2] || []).push(r);
  });
  Object.keys(byState).sort().forEach(function (s2) {
    groups.push({ key:s2, label:stateName(s2), rows:byState[s2] });
  });

  groups.forEach(function (grp) {
    var wrap = document.createElement("div");
    wrap.className = "state" + (grp.star ? " starred" : "");
    var wetN = grp.rows.filter(function (r) { return r.rb > 0; }).length;
    /* 114 seeds is a scroll, not a list. Every launch starts with the state
       groups collapsed; a group opens when TODAY'S paste puts rain at one of
       its farms or in one of their districts, and the starred watch list is
       always open. A group toggled by hand keeps that choice for the session. */
    var rainy = grp.rows.some(function (r) { return r.rb > 0 || (r.rb === 0 && r.dw); });
    var pref = ROSTER_OPEN[grp.key];
    var open = pref === undefined ? (grp.star || rainy) : !!pref;
    wrap.className += open ? " open" : "";
    wrap.innerHTML = "<h3><span class='caret'>\u203a</span>" +
      (grp.star ? "\u2b50 " : "") + grp.label +
      " <em" + (wetN > 0 ? " class='wet'" : "") + ">" + wetN + "/" + grp.rows.length + "</em></h3>" +
      "<div class='grows'></div>";
    var body = wrap.querySelector(".grows");
    wrap.querySelector("h3").onclick = function () {
      ROSTER_OPEN[grp.key] = !wrap.classList.contains("open");
      wrap.classList.toggle("open");
    };
    grp.rows.sort(function (a, b) {
      return (b.rb || 0) - (a.rb || 0) ||
             (a.dist && b.dist ? a.dist.name.localeCompare(b.dist.name) : 0);
    }).forEach(function (r) {
      var on = r.rb > 0;
      var near = !on && r.rb === 0 && r.dw;     /* dry here, raining in the district */
      var chip = on ? LEVELS[r.rb].fill : near ? LEVELS[r.dw.band].fill : "#2a2f4a";
      var d = document.createElement("div");
      d.className = "row" + (on ? " on" : near ? " near" : "");
      d.innerHTML =
        '<span class="chip" style="background:' + chip + '"></span>' +
        '<span class="nm"><b></b><span></span></span>' +
        '<span class="tag ' + (on ? "rain" : "") + '"></span>';
      d.querySelector(".nm b").textContent = (r.fav.st ? "\u2b50 " : "") + r.fav.n;
      d.querySelector(".nm span").textContent =
        (r.dist ? distName(r.dist) + (grp.star ? ", " + stateName(r.dist.state) : "")
                : T("unassigned"))
        + (r.fav.g ? "  \u00b7  " + r.fav.g : "") + "  \u00b7  "
        + r.fav.la.toFixed(3) + ", " + r.fav.lo.toFixed(3);
      var tag = d.querySelector(".tag");
      if (r.rb == null) tag.textContent = "\u2014";
      else if (r.rb < 0) tag.textContent = T("noData");
      else if (on) {
        tag.textContent = T("lv")[r.rb]
          + (r.pi.mm != null ? "  " + (stepCapped(r.pi.step, r.pi.pal) ? "\u2265" : "")
             + fmtRate(r.pi.mm) + " mm/h" : "");
        if (hotRate(r.pi.mm)) tag.classList.add("hot");
      } else if (near) {
        tag.textContent = T("inDist") + " " + T("lv")[r.dw.band]
          + (r.dw.mm != null ? " " + fmtRate(r.dw.mm) + " mm/h" : "");
      } else tag.textContent = T("lv")[0];
      body.appendChild(d);
    });
    host.appendChild(wrap);
  });
  document.getElementById("sourceNote").textContent = T("source");
  document.getElementById("builtNote").textContent = T("builtWith");
  paintCred();

/* iOS Safari ignores <a download> entirely — the tap produced a toast and no
   file. Web Share is the mechanism that works there, and it opens the share
   sheet, which is what this bulletin is for anyway: straight into WhatsApp
   rather than via the photo album. Desktop keeps the plain download. */
function canSharePng() {
  if (!navigator.canShare || !navigator.share) return false;
  try { return navigator.canShare({ files:[new File([""], "a.png", { type:"image/png" })] }); }
  catch (e) { return false; }
}

function deliverPng(blob, name) {
  var file = null;
  try { file = new File([blob], name, { type:"image/png" }); } catch (e) { file = null; }

  if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
    navigator.share({ files:[file], title:T("bTitle") })
      .then(function () { toast(T("shared")); })
      .catch(function (err) {
        if (err && err.name === "AbortError") return;   /* user closed the sheet */
        downloadPng(blob, name);
      });
    return;
  }
  downloadPng(blob, name);
}

function downloadPng(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  if ("download" in a) {
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 6000);
    toast(T("saved"));
    return;
  }
  /* last resort — an iOS build with neither share nor download: show the image
     so it can be long-pressed and saved by hand */
  var w = window.open(url, "_blank");
  toast(w ? T("longPress") : "PNG \u00d7");
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

/* Render the bulletin SVG to a PNG blob; cb(blob), null on failure. Split out
   of savePng so the WhatsApp share reuses the exact same rasterisation. */
function renderPng(cb) {
  var svg = document.getElementById("bulletin");
  var vb = svg.getAttribute("viewBox").split(" ").map(Number);
  var clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", SVGNS);
  // inline the font stack so the rasteriser matches the screen
  var st = document.createElementNS(SVGNS, "style");
  st.textContent = 'text{font-family:' + getComputedStyle(document.body).fontFamily.replace(/"/g, "'") + '}';
  clone.insertBefore(st, clone.firstChild);
  var src = new XMLSerializer().serializeToString(clone);
  var img = new Image(), scale = 2;
  img.onload = function () {
    var c = document.createElement("canvas");
    c.width = vb[2] * scale; c.height = vb[3] * scale;
    var x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (b) { cb(b || null); }, "image/png");
  };
  img.onerror = function () { toast("PNG ×"); cb(null); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
}
function savePng() {
  renderPng(function (b) { if (b) deliverPng(b, pngName()); });
}

   desktop / fallback — WhatsApp opens with the text pre-filled, the PNG
   downloads for attaching, and the text sits on the clipboard either way,
   because some WhatsApp builds drop the caption when a file is attached. */
function copyPlain(s) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).catch(function () {});
      return;
    }
  } catch (e) {}
  try {
    var ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) {}
}

function rainRosterText() {
  if (!RADAR) return "";

  liveFavs().forEach(function (f) {

    var key = f.n + "|" + f.la.toFixed(5) + "," + f.lo.toFixed(5);
    if (seen[key]) return;              /* grouped duplicates report identical rain */
    seen[key] = 1;
    var d = districtAt(f.lo, f.la);
    var st = d ? d.state : "\u2014";
    (byState[st] = byState[st] || []).push({ f:f, pi:pi, d:d });
  });
  var states = Object.keys(byState).sort();
  if (!states.length) return "";

  states.forEach(function (st) {

      .sort(function (a, b) { return (b.pi.band - a.pi.band) || (b.pi.step - a.pi.step); })
      .forEach(function (o) {

   a clipboard write or a share that starts after an await. */
/* navigator.share() must be called while the tap that triggered it still
   counts as user activation. Rasterising first spends that activation on
   img.onload + toBlob, and iOS then rejects the share with NotAllowedError —
   which is why the sheet never appeared. So the bulletin PNG is rendered
   ahead of time, right after the card is drawn, and the share call happens
   synchronously inside the tap. WeatherNext solved the same problem with a
   two-tap cache; pre-warming makes the first tap work instead. */
var PNGWARM = null, PNGWARMING = false;

   and the PNG downloads — this is the path that produces two messages, so it
   is only ever reached when the browser can do nothing better. */
function waFallback(blob, name, text) {
  var isMobile = isMobileUA();
  var waUrl = (isMobile ? "https://wa.me/?text=" : "https://web.whatsapp.com/send?text=")
            + encodeURIComponent(text);

/* Desktop: WhatsApp Web has no way to receive a file from a URL, so a prefilled
   ?text= can only ever become its own message — that is the two-message split.
   Instead put BOTH flavours on the clipboard in one write: pasting into the
   chat gives the image (WhatsApp opens its editable preview with a caption
   box), pasting again inside that caption box gives the text. One message,
   image with caption, same as the mobile sheet. */
function waClipboardRoute(blobP, text) {
  if (isMobileUA()) return false;       /* WhatsApp Web is desktop-only */
  /* Two field failures taught this shape. A ClipboardItem with image+text
     never fills the caption (pasting there attaches another image), and the
     /send?text= composer prefill sends the text FIRST as its own message on
     his build. Chrome also refuses clipboard writes from an unfocused tab,
     so the app cannot swap the clipboard behind WhatsApp's back. What works
     on every build is sequenced clipboards, driven by the person: image on
     the clipboard, paste it; come back, one tap on 复制文字, paste the
     caption. The dialog stays open as that second step. */
  var route = false;
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      var item = new ClipboardItem({
        "image/png": blobP.then(function (b) { return b || Promise.reject(new Error("png")); })
      });
      route = "step";
      navigator.clipboard.write([item]).then(function () {
        var wa = null;
        try { wa = window.open("https://web.whatsapp.com/", "_blank", "noopener,noreferrer"); } catch (e) {}
        toast(wa ? T("waDeskStep") : T("waBlocked"));
      }).catch(function () {
        blobP.then(function (b) { copyPlain(text); waFallback(b, pngName(), text); });
      });
    }
  } catch (e) { route = false; }
  return route;
}

function shareWhatsApp(text) {
  var warm = PNGWARM;
  var blobP = warm ? Promise.resolve(warm) : new Promise(function (res) { renderPng(res); });


  /* Phone (and any desktop OS with a share sheet): one send, image + caption,

    if (warm) {

          .then(function () { toast(T("shared")); })

            waFallback(warm, pngName(), text);

       NotAllowedError and the next tap — with the cache now warm — works. */
    blobP.then(function (blob) {

      try { file = new File([blob], pngName(), { type:"image/png" }); } catch (e) { file = null; }
      if (!file) { waFallback(blob, pngName(), text); return; }
      navigator.share({ files:[file], title:T("bTitle"), text:text })
        .then(function () { toast(T("shared")); })
        .catch(function (err) {
          if (err && err.name === "AbortError") return;   /* user closed the sheet */
          if (err && err.name === "NotAllowedError") { toast(T("waAgain")); return; }
          waFallback(blob, pngName(), text);
        });
    });

  }

  /* Sharing and the image clipboard both need a secure context; from file://
     neither exists, so say so rather than silently doing something lesser. */
  if (!window.isSecureContext) toast(T("waHttps"));

  /* Phone without file sharing (in-app browser, file://, older WebView):
     hand off to the WhatsApp APP via wa.me — never WhatsApp Web, which on a
     phone is a dead end telling you to open a computer. The picture is saved
     to the camera roll / downloads so it can be attached in the chat. */
  if (isMobileUA()) {
    var waUrl = "https://wa.me/?text=" + encodeURIComponent(text);
    var wa = null;

    copyPlain(text);
    toast(wa ? T("waApp") : T("waBlocked"));

  }

  /* Desktop browsers: clipboard route, started inside the gesture. */
  var deskRoute = waClipboardRoute(blobP, text);
  if (deskRoute) return true;   /* desktop: the dialog stays open as step 2 */

  copyPlain(text);
  blobP.then(function (blob) { waFallback(blob, pngName(), text); });
}

/* ══ favourites editor ══ */
function paintList() {
  var h = document.getElementById("fList"); h.innerHTML = "";
  /* Starred farms stay pinned even when the dots are hidden, and sort to the
     top of the roster — with 114 seeds, marking the handful that matter today
     is the difference between a useful list and a wall. Scrolling 114 rows to
     find your own plot is not a workflow, so the list is searchable and the
     starred ones float to the top. */
  var qEl = document.getElementById("fFind");
  var q = (qEl && qEl.value || "").trim().toLowerCase();
  var idx = FAVS.map(function (f, i) { return { f:f, i:i }; })
    .filter(function (o) { return !o.f.del; });
  idx.sort(function (a, b) { return (b.f.st || 0) - (a.f.st || 0) || a.i - b.i; });
  var nStar = 0;
  FAVS.forEach(function (f) { if (f.st && !f.del) nStar++; });
  /* 114 rows in one scroll is the wall this dialog was built to avoid, and the
     search box only helps when you already know the name. Grouped by state and
     collapsed, the list opens at ten headings instead. Starred farms keep their
     own group at the top — those are today's farms.

     While searching, everything is open: hiding a match behind a closed
     heading would make the search look broken. */
  var groups = [], byState = {}, starRows = [];
  var shown = 0;
  idx.forEach(function (o) {
    var f = o.f;
    if (q) {
      var hay = (f.n + " " + (f.g || "")).toLowerCase();
      var dd0 = districtAt(f.lo, f.la);
      if (dd0) hay += " " + dd0.name.toLowerCase() + " " + (DIST_ZH[dd0.name] || "")
                    + " " + dd0.state.toLowerCase() + " " + (STATE_ZH[dd0.state] || "");
      if (hay.indexOf(q) < 0) return;
    }
    shown++;
    if (f.st) { starRows.push(o); return; }
    var dd = districtAt(f.lo, f.la);
    var st = dd ? dd.state : "\u2014";
    (byState[st] = byState[st] || []).push(o);
  });
  if (starRows.length) groups.push({ key:"\u2605", label:T("starred"), rows:starRows });
  Object.keys(byState).sort().forEach(function (st) {
    groups.push({ key:st, label:stateName(st), rows:byState[st] });
  });

  function rowFor(o) {
    var f = o.f, i = o.i;
    var d = document.createElement("div"); d.className = "li";
    d.innerHTML = "<button class='star' aria-label='star'></button>" +
      "<span></span><code>" + f.la.toFixed(4) + ", " + f.lo.toFixed(4) +
      "</code><button class='x' aria-label='remove'>\u00d7</button>";
    var sb = d.querySelector(".star");
    sb.textContent = f.st ? "\u2b50" : "\u2606";
    sb.className = "star" + (f.st ? " on" : "");
    sb.onclick = function () { f.st = f.st ? 0 : 1; saveFavs(); paintList(); render(); };
    d.querySelector("span").textContent = f.n;
    d.querySelector(".x").onclick = function () {
      if (isMine(f)) f.del = 1;               /* recoverable — the user typed it */
      else FAVS.splice(i, 1);                 /* seeds come back with 还原示范 */
      saveFavs(); paintList(); render();

  }

  groups.forEach(function (g) {
    var open = q ? true : !!FLIST_OPEN[g.key];
    var wrap = document.createElement("div"); wrap.className = "fgrp";
    var head = document.createElement("button");

    var car = document.createElement("span");
    car.className = "caret"; car.textContent = "\u203a";
    car.style.transform = open ? "rotate(90deg)" : "rotate(0deg)";
    var nm = document.createElement("span"); nm.className = "fgn"; nm.textContent = g.label;
    var ct = document.createElement("em"); ct.textContent = g.rows.length;
    head.appendChild(car); head.appendChild(nm); head.appendChild(ct);

    h.appendChild(wrap);
  });

    shown + " / " + liveFavs().length + "   \u2b50 " + nStar;

  var bin = FAVS.filter(function (f) { return f.del; });
  binHost.innerHTML = "";
  document.getElementById("fBinWrap").hidden = !bin.length;
  if (bin.length) {
    document.getElementById("fBinHead").textContent = T("deleted") + "  " + bin.length;
    bin.forEach(function (f) {
      var d = document.createElement("div"); d.className = "li";
      d.innerHTML = "<span></span><code>" + f.la.toFixed(4) + ", " + f.lo.toFixed(4) + "</code>" +
        "<button class='tool' style='padding:3px 8px'>" + T("btnRestore") + "</button>";

/* ══════════════════════════════════════════════════════════════════
   PASTE → CALIBRATE → REPROJECT
   ══════════════════════════════════════════════════════════════════ */
var IMGC = null, IMGX = null, ANCH = [], SHOWCOAST = false, DRAG = false, AUTO = 0;
var AUTOCAL = null, MANUAL = false, LASTREG = null, RECALLED = null;
var SHOT_AT = 0;                              /* when the screenshot was taken */
var TIMEMODE = store.get("timeMode", "shot"); /* "shot" or "paste" */

function runRegistration() {
  if (!IMGC) return;
  /* Identify the source the moment the image arrives — NOT after a
     calibration is accepted. This lived in addLayer(), which only runs on a
     successful registration, so the one situation where knowing the source
     matters most — a paste the matcher is struggling with — was exactly the
     situation where detection never executed. The legend does not care
     whether the coastline matched. */
  var srcId = null;
  try { srcId = detectSource(IMGX, IMGC.width, IMGC.height); } catch (e) { srcId = null; }
  LASTSRC = srcId;
  if (srcId && srcId.app && knownSources().indexOf(srcId.palette) >= 0
      && srcId.palette !== ZRSEL) {
    ZRSEL = srcId.palette; store.set("zrSel", ZRSEL);
  }
  paintZR();
  var rec = null;
  try { rec = recallCal(IMGX, IMGC.width, IMGC.height); } catch (e) { rec = null; }
  if (rec) {
    /* a remembered framing that still verifies beats any fresh search */
    BASEMAP = learnBasemap(IMGX, IMGC.width, IMGC.height); resetBandCache();
    ANCH = rec.anch.slice();
    AUTOCAL = null; LASTREG = null; RECALLED = rec;
    SHOWCOAST = true;
    document.getElementById("calCoast").setAttribute("aria-pressed", "true");
    drawCal(); paintAnchors();
    toast(T("recalled"));
    if (BATCH || QUEUE.length) { addLayer(); queueNext(); }
    return;
  }
  RECALLED = null;
  var r = null;
  try { r = registerImage(IMGX, IMGC.width, IMGC.height); } catch (e) { r = null; }
  LASTREG = r;
  /* A region that is mostly off-frame is not a match, however crisp the
     edges it did find. 0.55 keeps genuine part-cropped captures (a phone
     screenshot always loses a little coast) while rejecting fragments. */
  /* When the region is named there is nothing left to be ambiguous WITH, so
     margin stops being evidence — fit and framing still have to hold up. */
  /* Coverage no longer gates either: on a full-screen capture every region
     fits somewhere, so it rejected good matches without catching bad ones. */
  AUTOCAL = (r && r.fit >= 2.0 &&
             (REGION_HINT !== "auto" || r.margin >= 1.12)) ? r : null;
  if (AUTOCAL) { SHOWCOAST = true; document.getElementById("calCoast").setAttribute("aria-pressed", "true"); }
  drawCal(); paintAnchors();
  if (AUTOCAL && (BATCH || QUEUE.length)) {
    /* confident enough to use is confident enough to add — the layer row and
       its fit are both visible afterwards, and a bad one can be dropped */
    addLayer();
    queueNext();
    return;
  }
  toast(AUTOCAL ? T("scanOk") : T("scanNo"));
  if (!AUTOCAL) {
    QUEUE = []; BATCH = false;         /* stop the batch so this one can be sorted out */
    showManual(true);
  }
}
function showManual(on) {
  MANUAL = on;
  document.getElementById("calManualBox").hidden = !on;
  document.getElementById("calManual").setAttribute("aria-pressed", on);
}

function currentCal() {
  if (ANCH.length >= 2) {
    return solveCal(ANCH.map(function (a) {
      return { wx:wmx(a.lon), wy:wmy(a.lat), px:a.px, py:a.py };
    }));
  }
  if (ALIGNCAL) return ALIGNCAL;
  if (ALIGN) return alignImageCal();
  return AUTOCAL;
}

/* Layers were always plural; only the intake was single-file. Take a whole
   batch, register each in turn, and add the confident ones without asking. */
var QUEUE = [], BATCH = false;
function enqueueFiles(list) {
  var imgs = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i] && String(list[i].type).indexOf("image") === 0) imgs.push(list[i]);
  }
  if (!imgs.length) return;
  var pending = imgs.length, slots = new Array(pending);
  imgs.forEach(function (f, idx) {
    var fr = new FileReader();
    fr.onload = function () {
      /* A screenshot's lastModified is the moment it was taken, which is the
         radar frame time to within seconds — better than the wall clock at
         paste, and it needs no typing. */
      var shot = f.lastModified || 0;
      if (!shot || Math.abs(Date.now() - shot) > 36 * 3600 * 1000) shot = 0;
      slots[idx] = { src:fr.result, shot:shot };
      if (--pending === 0) {
        QUEUE = QUEUE.concat(slots.filter(Boolean));
        BATCH = QUEUE.length > 1;
        queueNext();
      }
    };
    fr.readAsDataURL(f);
  });
}
function queueNext() {
  if (!QUEUE.length) { BATCH = false; return; }
  var it = QUEUE.shift();
  SHOT_AT = it.shot || 0;
  loadImage(it.src);
}

function loadImage(src) {
  var im = new Image();
  im.onload = function () {
    IMGC = document.createElement("canvas");
    IMGC.width = im.naturalWidth; IMGC.height = im.naturalHeight;
    IMGX = IMGC.getContext("2d", { willReadFrequently:true });
    IMGX.drawImage(im, 0, 0);
    ANCH = []; AUTO = 0; AUTOCAL = null; LASTREG = null; RECALLED = null;
    document.getElementById("calDrop").hidden = true;
    document.getElementById("calWork").hidden = false;
    SHOWCOAST = false;
    paintTimeBar();
    drawCal();
    var t = document.getElementById("calFitTxt");
    t.textContent = T("scanning"); t.style.color = "var(--amber)";
    document.getElementById("calApply").disabled = true;
    /* let the browser paint the notice before the search blocks the thread */
    setTimeout(runRegistration, 40);
  };
  im.onerror = function () { toast("\u00d7"); };
  im.src = src;
}

/* ══ Passport-photo calibration ═══════════════════════════════════
   The two-anchor fallback asked a person to name a pixel — the wrong job for
   a person. Here the human does what humans are good at (recognising "that
   is roughly it") and the machine does what it is provably good at (the last
   few pixels). The SCREENSHOT stays put at its natural size; the red region
   outline is what the finger drags and pinches onto it — moving the small
   object onto the big one, not the reverse, which was v4.27.0's mistake and
   made every adjustment a long march. When auto found a candidate, the
   outline starts there, so the human is often one nudge from done. ALIGN,
   while the mode is on, IS the live calibration in full-image pixels. */
var ALIGN = null, ALIGNE = null, ALIGNCAL = null;

function alignRegion() { return REGION_HINT !== "auto" ? REGION_HINT : "west"; }

var ALIGNPTS = null;   /* coarse outline of the current region, for guardrails */
function alignPts() {
  var key = alignRegion();
  if (!ALIGNPTS || ALIGNPTS.key !== key) ALIGNPTS = { key:key, pts:coastWorld(220, key) };
  return ALIGNPTS.pts;
}

/* what fraction of the outline a given cal leaves inside the screenshot */
function alignVisible(cal) {
  var pts = alignPts(), inside = 0;
  for (var i = 0; i < pts.length; i++) {
    var px = cal.A * pts[i][0] + cal.Bx, py = cal.A * pts[i][1] + cal.By;
    if (px >= 0 && py >= 0 && px < IMGC.width && py < IMGC.height) inside++;
  }
  return pts.length ? inside / pts.length : 0;
}

/* the region outline fitted inside the screenshot — always visible */
function alignFitCal() {
  var pts = coastWorld(600, alignRegion()), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (var i = 0; i < pts.length; i++) {
    if (pts[i][0] < x0) x0 = pts[i][0]; if (pts[i][0] > x1) x1 = pts[i][0];
    if (pts[i][1] < y0) y0 = pts[i][1]; if (pts[i][1] > y1) y1 = pts[i][1];
  }
  var A = Math.min(IMGC.width / (x1 - x0), IMGC.height / (y1 - y0)) * 0.9;
  return { A:A, Bx:IMGC.width / 2 - A * (x0 + x1) / 2, By:IMGC.height / 2 - A * (y0 + y1) / 2 };
}

/* a starting cal: auto's answer only if it actually shows the outline —
   a wrong auto cal was seeding the outline mostly off-frame, which is
   unrecoverable by feel. A quarter in view is the floor for "useful". */
function alignInitCal() {
  var base = ALIGNCAL || AUTOCAL;
  if (base && base.A) {
    var cand = { A:base.A, Bx:base.Bx, By:base.By };
    if (alignVisible(cand) >= 0.25) return cand;
  }
  return alignFitCal();
}

function alignImageCal() {
  if (!ALIGN) return null;
  return { A:ALIGN.A, Bx:ALIGN.Bx, By:ALIGN.By, shape:alignRegion(), manual:true };
}
function alignFromCal(cal) { ALIGN = { A:cal.A, Bx:cal.Bx, By:cal.By }; }

function alignClear() {
  ALIGN = null; ALIGNCAL = null; ALIGNE = null;
  var b = document.getElementById("alignBar"); if (b) b.hidden = true;
  var btn = document.getElementById("calAlign");
  if (btn) btn.setAttribute("aria-pressed", "false");
  var cv = document.getElementById("calCv"); if (cv) cv.style.touchAction = "";
}

function setAlign(on) {
  if (!on) { alignClear(); drawCal(); return; }
  var cv = document.getElementById("calCv");
  /* The red line of a failed auto attempt must not linger under the align
     outline — the person came here to escape that answer, not to squint past
     it. One outline on screen: the one being dragged. */
  SHOWCOAST = false;
  var cb = document.getElementById("calCoast");
  if (cb) cb.setAttribute("aria-pressed", "false");
  ALIGN = alignInitCal();
  ALIGNCAL = null; ALIGNE = null;
  document.getElementById("alignBar").hidden = false;
  document.getElementById("calAlign").setAttribute("aria-pressed", "true");
  cv.style.touchAction = "none";
  var t = document.getElementById("calFitTxt");
  t.textContent = T("alignHint"); t.style.color = "var(--dim)";
  document.getElementById("calApply").disabled = false;
  drawCal();
}

/* pan in image px; zoom scales the outline by f about image point (mx,my).
   Every step is clamped: a move that would leave less than 12% of the
   outline on screen is refused, so the outline can drift to the edge but
   never be lost off it. */
function alignTry(next) {
  if (alignVisible(next) < 0.12) return false;
  ALIGN = next; drawCal(); return true;
}
function alignPan(dx, dy) {
  if (!ALIGN) return;
  alignTry({ A:ALIGN.A, Bx:ALIGN.Bx + dx, By:ALIGN.By + dy });
}
function alignZoom(f, mx, my) {
  if (!ALIGN) return;
  alignTry({ A:ALIGN.A * f,
             Bx:mx + (ALIGN.Bx - mx) * f,
             By:my + (ALIGN.By - my) * f });
}

function snapAlign() {
  var cal = alignImageCal(); if (!cal) return;
  if (!ALIGNE) {
    ALIGNE = edgeMap(IMGX, IMGC.width, IMGC.height);
    ALIGNE.D = distTransform(ALIGNE.bin, ALIGNE.w, ALIGNE.h);
  }
  /* No rain mask here, deliberately. The mask exists so the blind auto-search
     is not punished for coastline it cannot see; in align mode a person has
     already put the outline where it belongs, so within that vetted basin
     every edge is signal — and on Rain Alarm's dark basemap the mask can
     swallow the whole frame, leaving Snap nothing to climb. */
  var E = { bin:ALIGNE.bin, w:ALIGNE.w, h:ALIGNE.h, f:ALIGNE.f, D:ALIGNE.D };
  var key = alignRegion();
  var pts = sceneWorld(1100).concat(coastWorld(900, key));
  /* The person has DECLARED the framing; the auto-search floors (which
     reject candidates with most points off-frame) must not veto it. Score
     only the coastline actually visible in the declared frame. */
  var seed = { A:cal.A * E.f, bx:cal.Bx * E.f, by:cal.By * E.f };
  var vis = pts.filter(function (p) {
    var px = seed.A * p[0] + seed.bx, py = seed.A * p[1] + seed.by;
    return px > -E.w * 0.1 && py > -E.h * 0.1 && px < E.w * 1.1 && py < E.h * 1.1;
  });
  if (vis.length >= 40) pts = vis;
  var best = { c:seed, v:-1 };
  best.v = chamfer(E, pts, best.c);
  [6, 3, 1.5, 0.7].forEach(function (step) {
    var better = true;
    while (better) {
      better = false;
      for (var dA = -1; dA <= 1; dA++) for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        if (!dA && !dx && !dy) continue;
        var A2 = best.c.A * (1 + dA * step * 0.004);
        var c2 = { A:A2,
                   bx:(best.c.bx - E.w / 2) * (A2 / best.c.A) + E.w / 2 + dx * step,
                   by:(best.c.by - E.h / 2) * (A2 / best.c.A) + E.h / 2 + dy * step };
        var v = chamfer(E, pts, c2);
        if (v > best.v) { best = { c:c2, v:v }; better = true; }
      }
    }

  ALIGNCAL = { A:best.c.A / E.f, Bx:best.c.bx / E.f, By:best.c.by / E.f,
               fit:z, shape:key, manual:true };
  alignFromCal(ALIGNCAL);
  drawCal();
  var t = document.getElementById("calFitTxt");
  /* On soup-heavy basemaps the contrast score reads 0 even when the lock is
     visibly right, so a number would only mislead — the person's eyes are
     the acceptance test here. */
  t.textContent = T("alignLocked") + (z > 0 ? "  \u00b7  z " + z.toFixed(2) : "");
  t.style.color = "var(--dim)";
  document.getElementById("calApply").disabled = false;
}

function drawCal() {
  if (!IMGC) return;
  var cv = document.getElementById("calCv");
  var sc = Math.min(1, 900 / IMGC.width);
  cv.width  = Math.round(IMGC.width  * sc);
  cv.height = Math.round(IMGC.height * sc);

function reprojectImage(cal, canvas, ctx, basemap, palette, fills) {
  BASEMAP = basemap || null; PALETTE = palette || null;
  BASEFILLS = fills || [];    /* the fills learned from THIS image, not the last one */
  resetBandCache();

  /* bulk pass runs on a capped copy — the grid is 2 km, so more pixels buy nothing */
  var f = Math.min(1, 2000 / Math.max(canvas.width, canvas.height));
  var wc, wx;
  if (f < 1) {
    wc = document.createElement("canvas");
    wc.width = Math.round(canvas.width * f); wc.height = Math.round(canvas.height * f);
    wx = wc.getContext("2d", { willReadFrequently:true });
    wx.drawImage(canvas, 0, 0, wc.width, wc.height);
  } else { wc = canvas; wx = ctx; }
  var data = wx.getImageData(0, 0, wc.width, wc.height).data;
  var sc = { A:cal.A * f, Bx:cal.Bx * f, By:cal.By * f };
  var cells = reproject(data, wc.width, wc.height, sc);
  cells.offshore = offshoreScan(sc, data, wc.width, wc.height);

}

function rememberCal(region) {

  var saved = store.get("cals", []).filter(function (sv) {

  });
  var E = edgeMap(IMGX, IMGC.width, IMGC.height);

               sig:basemapSignature(E) });

/* Try every remembered calibration against a freshly pasted image. */
function recallCal(ctx, iw, ih) {
  var saved = store.get("cals", []);
  if (!saved.length) return null;
  var E = edgeMap(ctx, iw, ih), sig = basemapSignature(E), best = null;
  saved.forEach(function (sv) {
    if (sv.w !== iw || sv.h !== ih) return;     /* same framing means same frame */
    var m = signatureMatch(sv.sig, sig);
    /* 0.65 sits well clear of both failure modes measured on real captures:
       a different framing scores near zero, and the same framing under heavy
       fresh rain still scores about 0.71. */
    if (m < 0.65) return;
    var cal = solveCal((sv.anch || []).map(function (a) {
      return { wx:wmx(a.lon), wy:wmy(a.lat), px:a.px, py:a.py };
    }));

    v.sig = m;

    }

/* ══════════════════════════════════════════════════════════════════
   Z–R CALIBRATION
   Fits log10(Z) = log10(a) + b·log10(R) by least squares on the user's own
   gauge readings, which is the only way to replace a textbook constant with
   something that describes Malaysian rain.
   ══════════════════════════════════════════════════════════════════ */
/* ── Cross-calibration between two pasted layers ──────────────────
   Rain Alarm's ladder is fundamentally reflectivity; Windy's gradient is
   fundamentally a rate. Two screenshots of the same moment therefore give
   (dBZ, mm/h) pairs directly, hundreds of them, with no time-integration or
   point-versus-area mismatch that a gauge reading would bring.

   What this fits is Windy's Z-R, not the ground truth — Windy derived its
   millimetres from reflectivity too. That is still worth having: it is a
   meteorological service's choice for this region rather than a constant
   picked from a textbook. */
function isLadder(L) { return !!(L.palette && L.palette.steps); }
function isRamp(L)   { return !!(L.palette && L.palette.ramp); }

function crossPairs() {
  var lad = LAYERS.filter(isLadder), ram = LAYERS.filter(isRamp);
  if (!lad.length || !ram.length) return [];
  var out = [];
  DIST.forEach(function (D, i) {
    var bestL = null, bestR = null;
    lad.forEach(function (L) {
      var t = L.cells[i];
      if (t && t.echo >= 3 && (!bestL || t.echo > bestL.echo)) bestL = t;
    });
    ram.forEach(function (L) {
      var t = L.cells[i];
      if (t && t.rN >= 3 && (!bestR || t.rN > bestR.rN)) bestR = t;
    });
    if (!bestL || !bestR) return;
    var st = districtStep(bestL);
    if (st < 2 || st > 10) return;              /* skip the noisy ends */
    var mm = districtRate(bestR);
    if (!(mm > 0.05)) return;
    out.push({ g:Math.round(mm * 100) / 100, d:stepDbz(st), n:D.name });
  });
  return out;
}

var ZRSEL = store.get("zrSel", "Windy");
var ZR_OPEN = false;
/* Which outline the next paste may match. Auto tries all three; naming the
   region removes the other hypotheses entirely, which is the difference
   between a hard problem and an easy one when a capture also contains

   screenshot may well be of somewhere else. */
var REGION_HINT = "auto";
var LASTSRC = null;         /* what the last paste's legend identified */
/* tile grid expanded? session-only, like the roster */
function allPairs() { return store.get("zrPairs", {}); }
function zrPairs() { var a = allPairs(); return a[ZRSEL] || []; }
function setZrPairs(v) { var a = allPairs(); a[ZRSEL] = v; store.set("zrPairs", a); }

function fitLine(P) {
  var n = P.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  });
  var den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-9) return null;
  var b = (n * sxy - sx * sy) / den;
  return { b:b, la:(sy - b * sx) / n };
}

function fitZR() {
  var P = zrPairs().filter(function (p) { return p.g > 0 && p.d > 0; });
  if (P.length < 3) return null;
  /* One district where the two apps simply disagree — different radar, a few
     minutes apart — can swing a small sample completely. Fit once, drop the
     worst residuals, fit again. */
  if (P.length >= 8) {
    var f0 = fitLine(P);
    if (f0) {
      var res = P.map(function (p) {
        var x = Math.log(p.g) / Math.LN10;
        return Math.abs(p.d / 10 - (f0.la + f0.b * x));
      });
      var sorted = res.slice().sort(function (a, b) { return a - b; });
      var cut = sorted[Math.floor(sorted.length * 0.8)];
      var keep = P.filter(function (p, i) { return res[i] <= cut; });
      if (keep.length >= Math.max(3, P.length * 0.6)) P = keep;
    }
  }
  var n = P.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;   /* y = log10(Z) */
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  });
  var den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-9) return null;
  var b = (n * sxy - sx * sy) / den;
  var la = (sy - b * sx) / n;
  if (!isFinite(b) || b <= 0.4 || b > 3) return null;
  /* R^2 */
  var mean = sy / n, ssTot = 0, ssRes = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;
    var f = la + b * x;
    ssTot += (y - mean) * (y - mean); ssRes += (y - f) * (y - f);
  });
  var r2 = (ssTot > 0 ? 1 - ssRes / ssTot : 1);
  /* A fit is only usable if the two sources actually agree AND the slope is
     physically sensible. Published Z-R exponents sit between about 1.0 and 2.0;
     anything outside that means the scatter, not the rain, set the slope. */
  var ok = r2 >= 0.5 && b >= 0.8 && b <= 2.2;
  return { a:Math.pow(10, la), b:b, n:n, r2:r2, ok:ok };
}
