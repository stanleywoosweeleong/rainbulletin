<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<link rel="manifest" href="./manifest.json">
<title>雨情通报 · RainBulletin</title>
<style>
/* ── tokens ─────────────────────────────────────────────
   ink      #101014   bulletin text / hairlines
   paper    #ffffff   bulletin ground (JMM white)
   jmm      #2323c8   MetMalaysia warning blue
   slate    #0f1020   app chrome (instrument housing)
   steel    #1c1e33   panel
   amber    #f0a92c   staleness / attention
   ───────────────────────────────────────────────────── */
:root{
  --ink:#101014; --paper:#fff; --jmm:#2323c8; --slate:#0f1020; --steel:#191c30;
  --line:#2b3050; --amber:#f0a92c; --red:#d9433f; --dim:#8b91b4; --text:#e8eaf6;
  --r0:#c9d2f5; --r1:#8e9deb; --r2:#5061dc; --r3:#2323c8; --r4:#14148c;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--slate); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.wrap{max-width:1120px;margin:0 auto;padding:14px 12px 48px}

/* ── masthead ── */
.mast{margin:4px 2px 14px}
.mastrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mast h1{
  font-size:17px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  margin:0;color:var(--text)
}
.mast .zh{letter-spacing:.24em;font-weight:700}
.mast .sub{display:block;margin-top:5px;font-family:var(--mono);font-size:11px;
  color:var(--dim);letter-spacing:.06em}
.spacer{flex:1}
.langbtn{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:none;color:var(--dim);
  border:1px solid var(--line);border-radius:2px;padding:4px 9px;cursor:pointer
}
.langbtn:hover{color:var(--text);border-color:#3d4470}

/* ── bulletin card (the signature) ── */
.card{background:var(--paper);border-radius:3px;overflow:hidden;box-shadow:0 1px 0 #000,0 10px 34px -14px #000}
#bulletin{display:block;width:100%;height:auto;touch-action:manipulation}
#bulletin text{font-family:var(--sans)}

/* ── toolbar ── */
.bar{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 18px}
button.tool{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  background:var(--steel);color:var(--text);border:1px solid var(--line);
  border-radius:2px;padding:8px 12px;cursor:pointer
}
button.tool:hover{border-color:#454d80}
button.tool[aria-pressed="true"]{background:var(--jmm);border-color:var(--jmm);color:#fff}
button.tool.go{background:var(--jmm);border-color:var(--jmm);color:#fff;font-weight:600}
button.tool:disabled{opacity:.4;cursor:default}
button.tool:focus-visible,.langbtn:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── roster ── */
h2.sec{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:500;margin:26px 2px 10px;
  border-bottom:1px solid var(--line);padding-bottom:7px
}
.state{margin-bottom:16px}
.state>h3{
  font-size:12.5px;font-weight:700;letter-spacing:.06em;margin:0 0 6px;color:#fff;
  display:flex;align-items:center;gap:8px
}
.state>h3 em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.05em}
.row{
  display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--steel);
  margin-bottom:5px
}
.row.on{border-color:#3a44a8;background:#181d3f}
.chip{width:14px;height:14px;border-radius:3px;background:#2a2f4a;border:1px solid #0a0c18}
.nm{min-width:0}
.nm b{font-weight:600;font-size:14px;display:block;line-height:1.25}
.nm span{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em}
.mm{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.mm small{display:block;font-size:9.5px;font-weight:400;color:var(--dim);letter-spacing:.05em}
.tag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 6px;border-radius:2px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap
}
.tag.rain{background:var(--jmm);border-color:var(--jmm);color:#fff}
.tag.storm{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:700}
.empty{
  border:1px dashed var(--line);border-radius:2px;padding:22px 16px;text-align:center;
  color:var(--dim);font-size:13.5px
}

/* ── editor ── */
dialog{
  border:1px solid var(--line);background:var(--steel);color:var(--text);border-radius:3px;
  padding:0;width:min(560px,94vw);max-height:86vh
}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
.dlg{padding:16px}
.dlg h3{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);color:var(--dim);font-weight:500}
.fld{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.fld label{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
input,textarea{
  width:100%;background:#0d0f1c;border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:7px 9px;font-family:var(--mono);font-size:12.5px
}
textarea{min-height:150px;line-height:1.45;resize:vertical}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.6;margin:8px 0 0}
.list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:2px;margin-top:10px}
.li{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid #232744;font-size:13px}
.li:last-child{border-bottom:0}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li code{font-family:var(--mono);font-size:10px;color:var(--dim)}
.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.foot{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.drop{border:1px dashed var(--line);border-radius:2px;padding:30px 14px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
.drop.over{border-color:var(--jmm);color:var(--text);background:#141833}
#calCv{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:2px;
  touch-action:none;cursor:crosshair;background:#0d0f1c;margin-bottom:10px}
.loupe{position:fixed;width:132px;height:132px;border-radius:50%;overflow:hidden;
  border:2px solid #fff;box-shadow:0 8px 26px -8px #000;pointer-events:none;display:none;z-index:200}
.loupe canvas{display:block;width:132px;height:132px}
select{width:100%;background:#0d0f1c;border:1px solid var(--line);color:var(--text);
  border-radius:2px;padding:7px 9px;font-family:var(--mono);font-size:12.5px}
dialog#cal{width:min(940px,96vw)}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;
  background:#fff;color:#101014;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  padding:9px 16px;border-radius:2px;box-shadow:0 8px 30px -8px #000;opacity:0;pointer-events:none;
  transition:opacity .18s
}
.toast.show{opacity:1}
@media(max-width:520px){
  .wrap{padding:12px 9px 40px}
  .mast h1{font-size:15px}
  .mast h1.zh{letter-spacing:.16em}
  .mast .sub{font-size:10.5px;letter-spacing:.04em}
  .row{grid-template-columns:12px 1fr auto;gap:8px}
  .fld{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <div class="mastrow">
      <h1 class="zh" data-i="brandZh">雨情通报</h1>
      <h1 data-i="brandEn">RAINBULLETIN</h1>
      <span class="spacer"></span>
      <button class="langbtn" id="lang">EN</button>
    </div>
    <span class="sub" data-i="tagline">收藏点 · 降雨县属着色</span>
  </div>

  <div class="card"><svg id="bulletin" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="bar">
    <button class="tool" id="vAll"  aria-pressed="true"  data-i="vAll">全国</button>
    <button class="tool" id="vPen"  aria-pressed="false" data-i="vPen">半岛</button>
    <button class="tool" id="vBor"  aria-pressed="false" data-i="vBor">东马</button>
    <span class="spacer"></span>
    <button class="tool" id="copy" data-i="btnCopy">复制文字</button>
    <button class="tool" id="png"  data-i="btnPng">存图 PNG</button>
    <button class="tool" id="paste" data-i="btnPaste">贴图雷达</button>
    <button class="tool" id="edit" data-i="btnEdit">收藏点</button>
    <button class="tool" id="zrBtn" data-i="btnZR">校准</button>
  </div>

  <h2 class="sec" data-i="secRoster">收藏点明细</h2>
  <div id="roster"></div>

  <h2 class="sec" data-i="secSource">数据来源</h2>
  <p class="hint" id="sourceNote"></p>
</div>

<dialog id="dlg"><div class="dlg">
  <h3 data-i="dlgTitle">收藏点管理</h3>
  <div class="fld"><label data-i="fName">名称</label><input id="fName" placeholder="順豪生态榴莲园"></div>
  <div class="fld"><label data-i="fLat">纬度 Lat</label><input id="fLat" inputmode="decimal" placeholder="3.2167"></div>
  <div class="fld"><label data-i="fLon">经度 Lon</label><input id="fLon" inputmode="decimal" placeholder="102.4167"></div>
  <div class="foot"><button class="tool go" id="fAdd" data-i="btnAdd">加入</button></div>
  <div class="list" id="fList"></div>
  <p class="hint" data-i="ioHint">批量：每行一个 <code>名称, 纬度, 经度</code></p>
  <textarea id="io" spellcheck="false"></textarea>
  <div class="foot">
    <button class="tool" id="fLoad" data-i="btnLoad">从文本载入</button>
    <button class="tool" id="fDump" data-i="btnDump">导出到文本</button>
    <button class="tool" id="fReset" data-i="btnReset">还原示范</button>
    <button class="tool go" id="fClose" data-i="btnClose">完成</button>
  </div>
</div></dialog>

<dialog id="zr"><div class="dlg">
  <h3 style="display:flex;align-items:center;gap:10px">
    <span data-i="dlgZR" style="flex:1">雨量校准 · Z–R</span>
    <button class="x" id="zrX" aria-label="close" style="font-size:20px">×</button>
  </h3>
  <p class="hint" id="zrNow"></p>
  <div class="fld"><label data-i="zrPreset">预设</label>
    <div class="bar" id="zrPresets" style="margin:0"></div></div>
  <div class="fld"><label>Z = a·R^b</label>
    <div style="display:flex;gap:8px">
      <input id="zrA" inputmode="decimal" placeholder="250">
      <input id="zrB" inputmode="decimal" placeholder="1.2">
      <input id="zrCap" inputmode="decimal" placeholder="53">
    </div></div>
  <p class="hint" data-i="zrHint">a · b · 封顶 dBZ</p>

  <h3 style="margin-top:16px" data-i="zrPairs">实测对照（雨量计 vs 雷达）</h3>
  <div class="fld"><label data-i="zrGauge">实测 mm/h</label><input id="zrG" inputmode="decimal" placeholder="18"></div>
  <div class="fld"><label data-i="zrDbz">当时 dBZ</label><input id="zrD" inputmode="decimal" placeholder="42.5"></div>
  <div class="foot"><button class="tool go" id="zrAdd" data-i="btnAdd">加入</button></div>
  <div class="list" id="zrList"></div>
  <p class="hint" id="zrFit"></p>
  <div class="foot">
    <button class="tool" id="zrCross" data-i="zrCross">从两图配对</button>
    <button class="tool" id="zrClear" data-i="zrClear">清空对照</button>
  </div>
  <div class="foot" style="border-top:1px solid var(--line);padding-top:12px;margin-top:14px">
    <button class="tool" id="zrReset" data-i="btnReset">还原</button>
    <button class="tool" id="zrDoFit" data-i="zrDoFit">用实测拟合</button>
    <button class="tool go" id="zrDone" data-i="done">完成</button>
  </div>
</div></dialog>

<dialog id="cal"><div class="dlg">
  <h3 style="display:flex;align-items:center;gap:10px">
    <span data-i="dlgCal" style="flex:1">贴图定位 · 重投影</span>
    <button class="x" id="calX" aria-label="close" style="font-size:20px">×</button>
  </h3>
  <div class="fld" style="grid-template-columns:1fr"><label data-i="layers">图层</label></div>
  <div class="list" id="lyrList" style="margin:0 0 10px"></div>
  <div class="fld" style="margin-bottom:12px"><label data-i="calSens">灵敏度</label>
    <div class="bar" id="calSensBar" style="margin:0"></div></div>
  <div class="drop" id="calDrop">
    <span data-i="calDrop">粘贴截图（⌘V / Ctrl-V）、拖入，或选择图片</span><br>
    <span class="hint" id="dropHint" style="display:block;margin-top:4px"></span>
    <button class="tool" id="calPick" data-i="calPick" style="margin-top:10px">选图片</button>
    <input type="file" id="calFile" accept="image/*" multiple hidden>
  </div>
  <div id="calWork" hidden>
    <canvas id="calCv"></canvas>
    <div id="calManualBox" hidden>
      <div class="fld"><label data-i="calAnchors">定位点</label><select id="calSel"></select></div>
      <p class="hint" data-i="calTap">在截图上点击地标位置，至少两个</p>
      <div class="list" id="calList"></div>
    </div>
    <p class="hint" id="calFitTxt"></p>
    <div class="fld"><label data-i="calTime">图内时间</label>
      <input id="calTimeIn" placeholder="12:59" spellcheck="false"></div>
    <div class="foot">
      <button class="tool" id="calCoast" aria-pressed="false" data-i="calCoast">叠示海岸线校对</button>
      <button class="tool" id="calManual" aria-pressed="false" data-i="manual">手动点选</button>
      <button class="tool go" id="calApply" data-i="addLayer">加入图层</button>
    </div>
  </div>
  <div class="foot" style="border-top:1px solid var(--line);padding-top:12px;margin-top:14px">
    <button class="tool" id="calClearImg" data-i="clearAll">清除全部</button>
    <button class="tool go" id="calDone" data-i="done">完成</button>
  </div>
</div></dialog>

<div class="loupe" id="loupe"><canvas id="loupeCv" width="132" height="132"></canvas></div>
<div class="toast" id="toast"></div>

<script>

var ARCS = null;      // decoded [lon,lat] polylines
var ARCKIND = null;   // 2 = coastline, 1 = state border, 0 = district border
var DIST = (function () {
  var tr = TOPO.transform, sx = tr.scale[0], sy = tr.scale[1], tx = tr.translate[0], ty = tr.translate[1];
  var arcs = TOPO.arcs.map(function (a) {
    var x = 0, y = 0, out = [];
    for (var i = 0; i < a.length; i++) { x += a[i][0]; y += a[i][1]; out.push([x*sx+tx, y*sy+ty]); }
    return out;
  });
  ARCS = arcs;

  /* An arc used by one ring only is a coastline; an arc shared by districts in
     two different states is a state border. Costs nothing extra to store. */
  var meta = arcs.map(function () { return { n:0, st:{} }; });
  TOPO.objects.districts.geometries.forEach(function (g) {
    (g.type === "Polygon" ? [g.arcs] : g.arcs).forEach(function (p) {
      p.forEach(function (r) {
        r.forEach(function (k) {
          var m = meta[k < 0 ? ~k : k]; m.n++; m.st[g.properties.state_name] = 1;
        });
      });
    });
  });
  ARCKIND = meta.map(function (m) {
    if (m.n <= 1) return 2;
    return Object.keys(m.st).length > 1 ? 1 : 0;
  });

  function ring(idx) {
    var out = [];
    for (var i = 0; i < idx.length; i++) {
      var k = idx[i], a = k < 0 ? arcs[~k].slice().reverse() : arcs[k];
      if (!out.length) out = a.slice(); else out = out.concat(a.slice(1));
    }
    return out;
  }
  return TOPO.objects.districts.geometries.map(function (g, n) {
    var polys = (g.type === "Polygon" ? [g.arcs] : g.arcs).map(function (p) { return p.map(ring); });
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, cx=0, cy=0, np=0;
    polys.forEach(function (p) { p[0].forEach(function (pt) {
      if(pt[0]<x0)x0=pt[0]; if(pt[0]>x1)x1=pt[0]; if(pt[1]<y0)y0=pt[1]; if(pt[1]>y1)y1=pt[1];
      cx+=pt[0]; cy+=pt[1]; np++;
    }); });
    return { id:n, name:g.properties.name, state:g.properties.state_name,

/* ── point in polygon ── */
function inRing(x, y, r) {
  var c = false;
  for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
    var xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function districtAt(lon, lat) {
  for (var d = 0; d < DIST.length; d++) {
    var D = DIST[d], b = D.bbox;
    if (lon < b[0]-0.001 || lon > b[2]+0.001 || lat < b[1]-0.001 || lat > b[3]+0.001) continue;
    for (var p = 0; p < D.polys.length; p++) {
      var poly = D.polys[p];
      if (inRing(lon, lat, poly[0])) {
        var hole = false;
        for (var h = 1; h < poly.length; h++) if (inRing(lon, lat, poly[h])) { hole = true; break; }
        if (!hole) return D;
      }
    }

  // offshore / boundary slop: snap to nearest district centroid within ~35 km
  var best = null, bd = 0.35;

}


/* ══════════════════════════════════════════════════════════════════
   GEOREFERENCE + REPROJECT
   A pasted Windy / Rain Alarm screenshot is a north-up Web Mercator
   image, so two tapped landmarks fully determine the transform:
       px = A·wx + Bx      py = A·wy + By
   The same A appears in both axes — that isotropy is the built-in
   check that the anchors were tapped correctly.
   ══════════════════════════════════════════════════════════════════ */
function wmx(lon) { return (lon + 180) / 360; }
function wmy(lat) {
  var s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
}

/* least squares over n≥2 anchors: solve A, Bx, By */
function solveCal(pts) {
  if (pts.length < 2) return null;
  var n = pts.length, mwx = 0, mwy = 0, mpx = 0, mpy = 0;
  pts.forEach(function (p) { mwx += p.wx; mwy += p.wy; mpx += p.px; mpy += p.py; });
  mwx /= n; mwy /= n; mpx /= n; mpy /= n;
  var num = 0, den = 0;
  pts.forEach(function (p) {
    num += (p.wx - mwx) * (p.px - mpx) + (p.wy - mwy) * (p.py - mpy);
    den += (p.wx - mwx) * (p.wx - mwx) + (p.wy - mwy) * (p.wy - mwy);
  });
  if (den <= 0) return null;
  var A = num / den;
  if (!isFinite(A) || A <= 0) return null;
  var cal = { A:A, Bx:mpx - A * mwx, By:mpy - A * mwy };
  var sq = 0;
  pts.forEach(function (p) {
    var dx = cal.A * p.wx + cal.Bx - p.px, dy = cal.A * p.wy + cal.By - p.py;
    sq += dx*dx + dy*dy;
  });
  cal.rmsPx = Math.sqrt(sq / n);
  cal.kmPerPx = 40075 / A;                 // world is A px wide at the equator
  cal.rmsKm = cal.rmsPx * cal.kmPerPx * Math.cos(3.5 * Math.PI / 180);
  return cal;
}

var GX0 = 99.2, GY1 = 7.6, GST = 0.02, GW = 1020, GH = 356, RASTER = null;

/* word-wrap the roll-call into bold-state / plain-district runs */
function buildFootLines(roll, maxW) {
  if (!roll.length) return [[{ t:(RADAR ? T("bNone") : T("noImg")), b:false }]];
  var segs = [];
  roll.forEach(function (r, i) {
    if (i) segs.push({ t:" • ", b:true });
    segs.push({ t:r.state, b:true });
    if (r.dists) segs.push({ t:" (" + r.dists.join(", ") + ")", b:false });
  });
  if (roll.more) segs.push({ t:"  … +" + roll.more + " " + T("more"), b:true });
  // approximate width: 7.2px per CJK char, 6.4 bold / 6.0 plain per latin char at 13.5px
  function w(s, b) {
    var n = 0;
    for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) > 255 ? 13.5 : (b ? 7.2 : 6.6);
    return n;
  }
  var lines = [[]], cur = 0;
  segs.forEach(function (seg) {
    var words = seg.t.split(/(?<=[ ,•(])/), buf = "";
    words.forEach(function (word) {
      var ww = w(word, seg.b);
      if (cur + ww > maxW && buf.trim()) {
        lines[lines.length-1].push({ t:buf, b:seg.b }); lines.push([]); cur = 0; buf = word.replace(/^\s+/, "");
        cur = w(buf, seg.b);
      } else { buf += word; cur += ww; }
    });
    if (buf) lines[lines.length-1].push({ t:buf, b:seg.b });
  });
  return lines;
}

/* ══════════════════════════════════════════════════════════════════
   PASTE → CALIBRATE → REPROJECT
   ══════════════════════════════════════════════════════════════════ */
var IMGC = null, IMGX = null, ANCH = [], SHOWCOAST = false, DRAG = false, AUTO = 0;
var AUTOCAL = null, MANUAL = false, LASTREG = null, RECALLED = null;

function runRegistration() {
  if (!IMGC) return;
  var rec = null;
  try { rec = recallCal(IMGX, IMGC.width, IMGC.height); } catch (e) { rec = null; }
  if (rec) {
    /* a remembered framing that still verifies beats any fresh search */
    BASEMAP = learnBasemap(IMGX, IMGC.width, IMGC.height); resetBandCache();
    ANCH = rec.anch.slice();
    AUTOCAL = null; LASTREG = null; RECALLED = rec;
    SHOWCOAST = true;
    document.getElementById("calCoast").setAttribute("aria-pressed", "true");
    drawCal(); paintAnchors();
    toast(T("recalled"));
    if (BATCH || QUEUE.length) { addLayer(); queueNext(); }
    return;
  }
  RECALLED = null;
  var r = null;
  try { r = registerImage(IMGX, IMGC.width, IMGC.height); } catch (e) { r = null; }
  LASTREG = r;
  AUTOCAL = (r && r.fit >= 2.0 && r.margin >= 1.12) ? r : null;
  if (AUTOCAL) { SHOWCOAST = true; document.getElementById("calCoast").setAttribute("aria-pressed", "true"); }
  drawCal(); paintAnchors();
  if (AUTOCAL && (BATCH || QUEUE.length)) {
    /* confident enough to use is confident enough to add — the layer row and
       its fit are both visible afterwards, and a bad one can be dropped */
    addLayer();
    queueNext();
    return;
  }
  toast(AUTOCAL ? T("scanOk") : T("scanNo"));
  if (!AUTOCAL) {
    QUEUE = []; BATCH = false;         /* stop the batch so this one can be sorted out */
    showManual(true);
  }
}
function showManual(on) {
  MANUAL = on;
  document.getElementById("calManualBox").hidden = !on;
  document.getElementById("calManual").setAttribute("aria-pressed", on);
}

function currentCal() {
  if (ANCH.length >= 2) {
    return solveCal(ANCH.map(function (a) {
      return { wx:wmx(a.lon), wy:wmy(a.lat), px:a.px, py:a.py };
    }));
  }
  return AUTOCAL;
}

/* Layers were always plural; only the intake was single-file. Take a whole
   batch, register each in turn, and add the confident ones without asking. */
var QUEUE = [], BATCH = false;
function enqueueFiles(list) {
  var imgs = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i] && String(list[i].type).indexOf("image") === 0) imgs.push(list[i]);
  }
  if (!imgs.length) return;
  var pending = imgs.length, slots = new Array(pending);
  imgs.forEach(function (f, idx) {
    var fr = new FileReader();
    fr.onload = function () {
      slots[idx] = fr.result;
      if (--pending === 0) {
        QUEUE = QUEUE.concat(slots.filter(Boolean));
        BATCH = QUEUE.length > 1;
        queueNext();
      }
    };
    fr.readAsDataURL(f);
  });
}
function queueNext() {
  if (!QUEUE.length) { BATCH = false; return; }
  loadImage(QUEUE.shift());
}

function loadImage(src) {
  var im = new Image();
  im.onload = function () {
    IMGC = document.createElement("canvas");
    IMGC.width = im.naturalWidth; IMGC.height = im.naturalHeight;
    IMGX = IMGC.getContext("2d", { willReadFrequently:true });
    IMGX.drawImage(im, 0, 0);
    ANCH = []; AUTO = 0; AUTOCAL = null; LASTREG = null; RECALLED = null;
    document.getElementById("calDrop").hidden = true;
    document.getElementById("calWork").hidden = false;
    SHOWCOAST = false;
    drawCal();
    var t = document.getElementById("calFitTxt");
    t.textContent = T("scanning"); t.style.color = "var(--amber)";
    document.getElementById("calApply").disabled = true;
    /* let the browser paint the notice before the search blocks the thread */
    setTimeout(runRegistration, 40);
  };
  im.onerror = function () { toast("\u00d7"); };
  im.src = src;
}

function drawCal() {
  if (!IMGC) return;
  var cv = document.getElementById("calCv");
  var sc = Math.min(1, 900 / IMGC.width);
  cv.width  = Math.round(IMGC.width  * sc);
  cv.height = Math.round(IMGC.height * sc);
  var x = cv.getContext("2d"), k = cv.width / IMGC.width;
  x.drawImage(IMGC, 0, 0, cv.width, cv.height);

  var cal = currentCal();
  if (SHOWCOAST && cal) {
    x.lineWidth = 1.8; x.strokeStyle = "#ff3b30"; x.beginPath();
    for (var a = 0; a < ARCS.length; a++) {
      if (ARCKIND[a] !== 2) continue;
      var pts = ARCS[a];
      for (var i = 0; i < pts.length; i++) {
        var qx = (cal.A * wmx(pts[i][0]) + cal.Bx) * k;
        var qy = (cal.A * wmy(pts[i][1]) + cal.By) * k;
        if (i) x.lineTo(qx, qy); else x.moveTo(qx, qy);
      }
    }
    x.stroke();
  }
  ANCH.forEach(function (a, i) {
    var px = a.px * k, py = a.py * k;
    x.strokeStyle = "#f0a92c"; x.lineWidth = 2;
    x.beginPath(); x.arc(px, py, 9, 0, 6.2832); x.stroke();
    x.beginPath();
    x.moveTo(px - 15, py); x.lineTo(px + 15, py);
    x.moveTo(px, py - 15); x.lineTo(px, py + 15); x.stroke();
    x.font = "bold 12px sans-serif";
    x.lineWidth = 3; x.strokeStyle = "#000";
    x.strokeText((i + 1) + " " + a.name, px + 14, py - 12);
    x.fillStyle = "#f0a92c"; x.fillText((i + 1) + " " + a.name, px + 14, py - 12);
  });
}

function evtToImg(e) {
  var cv = document.getElementById("calCv"), r = cv.getBoundingClientRect();
  return { x:((e.clientX - r.left) / r.width) * IMGC.width,
           y:((e.clientY - r.top) / r.height) * IMGC.height,
           cx:e.clientX, cy:e.clientY };
}

function commitAnchor(p) {

  });

  if (cal && RECALLED) {

    t.textContent = T("recalled") + " \u00b7 " + regionLabel(RECALLED.region)

    }

                    cal.kmPerPx.toFixed(2) + " km/px" + extra + (bad ? "  \u00b7  " + T("calBad") : "");
    t.style.color = bad ? "var(--red)" : "var(--dim)";
  }
  document.getElementById("calApply").disabled = !cal;
}

function reprojectImage(cal, canvas, ctx, basemap, palette) {
  BASEMAP = basemap || null; PALETTE = palette || null; resetBandCache();
  /* bulk pass runs on a capped copy — the grid is 2 km, so more pixels buy nothing */
  var f = Math.min(1, 2000 / Math.max(canvas.width, canvas.height));
  var wc, wx;
  if (f < 1) {
    wc = document.createElement("canvas");
    wc.width = Math.round(canvas.width * f); wc.height = Math.round(canvas.height * f);
    wx = wc.getContext("2d", { willReadFrequently:true });
    wx.drawImage(canvas, 0, 0, wc.width, wc.height);
  } else { wc = canvas; wx = ctx; }
  var data = wx.getImageData(0, 0, wc.width, wc.height).data;
  return reproject(data, wc.width, wc.height, { A:cal.A * f, Bx:cal.Bx * f, By:cal.By * f });
}

function rememberCal(region) {
  if (ANCH.length < 2) return;                  /* only hand-placed anchors */
  var saved = store.get("cals", []).filter(function (sv) {
    return !(sv.region === region && sv.w === IMGC.width && sv.h === IMGC.height);
  });
  var E = edgeMap(IMGX, IMGC.width, IMGC.height);
  saved.push({ region:region, w:IMGC.width, h:IMGC.height, anch:ANCH.slice(),
               sig:basemapSignature(E) });
  store.set("cals", saved.slice(-8));
}

/* Try every remembered calibration against a freshly pasted image. */
function recallCal(ctx, iw, ih) {
  var saved = store.get("cals", []);
  if (!saved.length) return null;
  var E = edgeMap(ctx, iw, ih), sig = basemapSignature(E), best = null;
  saved.forEach(function (sv) {
    if (sv.w !== iw || sv.h !== ih) return;     /* same framing means same frame */
    var m = signatureMatch(sv.sig, sig);
    /* 0.65 sits well clear of both failure modes measured on real captures:
       a different framing scores near zero, and the same framing under heavy
       fresh rain still scores about 0.71. */
    if (m < 0.65) return;
    var cal = solveCal((sv.anch || []).map(function (a) {
      return { wx:wmx(a.lon), wy:wmy(a.lat), px:a.px, py:a.py };
    }));
    if (!cal) return;
    var v = verifyCal(cal, E, sv.region);
    if (!v.ok) return;
    v.sig = m;
    if (!best || m > best.v.sig) {
      best = { anch:sv.anch, region:sv.region, cal:cal, v:v };
    }
  });
  return best;
}

function addLayer() {
  var cal = currentCal();
  if (!cal || !IMGC) return;
  var basemap = BASEMAP;                       /* learned during registration */
  var regionGuess = null;
  var det = detectPalette(IMGX, IMGC.width, IMGC.height);
  var palette = det ? det.pal : null;
  var cells = reprojectImage(cal, IMGC, IMGX, basemap, palette);
  var region = regionOf(cells);

  /* One layer per region PER SOURCE. A fresh Peninsular shot from the same app
     replaces yesterday's, but a Rain Alarm and a Windy view of the same region
     can sit side by side — which is what makes cross-calibration possible.
     rebuildRadar still lets the best-covering layer speak for each district,
     so nothing is double counted. */
  var pname = palette ? palette.name : "-";
  LAYERS = LAYERS.filter(function (L) {
    return !(L.region === region && (L.palette ? L.palette.name : "-") === pname);
  });
  LAYERS.push({ cal:cal, ctx:IMGX, canvas:IMGC, iw:IMGC.width, ih:IMGC.height,
                cells:cells, region:region, at:Date.now(), basemap:basemap, palette:palette,
                label:(document.getElementById("calTimeIn").value.trim() || fmt(Date.now())) });

  rememberCal(region);
  rebuildRadar();
  IMGC = null; IMGX = null; ANCH = []; AUTO = 0; AUTOCAL = null; RECALLED = null; showManual(false);
  document.getElementById("calDrop").hidden = false;
  document.getElementById("calWork").hidden = true;
  if (!QUEUE.length) document.getElementById("calTimeIn").value = "";
  paintLayers();
  render(); toast(T("calOk") + " \u00b7 " + regionLabel(region));
}

function recomputeAll() {
  LAYERS.forEach(function (L) { L.cells = reprojectImage(L.cal, L.canvas, L.ctx, L.basemap, L.palette); });
  rebuildRadar(); render();
}

function dropLayer(i) {
  LAYERS.splice(i, 1); rebuildRadar(); paintLayers(); render();
}

function clearRadar() {
  LAYERS = []; RADAR = null; IMGC = null; IMGX = null; ANCH = []; AUTOCAL = null; SHOWCOAST = false;
  document.getElementById("calDrop").hidden = false;
  document.getElementById("calWork").hidden = true;
  document.getElementById("calCoast").setAttribute("aria-pressed", "false");

}

function paintLayers() {
  var h = document.getElementById("lyrList");
  if (!h) return;
  h.innerHTML = "";
  if (!LAYERS.length) {
    var e = document.createElement("div");
    e.className = "li"; e.style.color = "var(--dim)";
    e.textContent = T("lyrEmpty"); h.appendChild(e); return;
  }
  LAYERS.forEach(function (L, i) {
    var cov = 0, wet = 0;
    L.cells.forEach(function (t) { if (t.inn > 0) { cov++; if (t.echo > 0) wet++; } });
    var pct = cov ? Math.round(100 * wet / cov) : 0;
    var d = document.createElement("div"); d.className = "li";
    d.innerHTML = "<span></span><code" + (pct > 70 ? " style='color:var(--amber)'" : "") + ">" +
                  cov + "/160 \u00b7 " + wet + " " + T("wetN") + " (" + pct + "%) \u00b7 " +
                  L.iw + "\u00d7" + L.ih +
                  "</code><button class='x' aria-label='remove'>\u00d7</button>";
    d.querySelector("span").textContent = regionLabel(L.region) + "  " + L.label;
    d.querySelector(".x").onclick = function () { dropLayer(i); };
    h.appendChild(d);
  });
}

/* ══════════════════════════════════════════════════════════════════
   Z–R CALIBRATION
   Fits log10(Z) = log10(a) + b·log10(R) by least squares on the user's own
   gauge readings, which is the only way to replace a textbook constant with
   something that describes Malaysian rain.
   ══════════════════════════════════════════════════════════════════ */
/* ── Cross-calibration between two pasted layers ──────────────────
   Rain Alarm's ladder is fundamentally reflectivity; Windy's gradient is
   fundamentally a rate. Two screenshots of the same moment therefore give
   (dBZ, mm/h) pairs directly, hundreds of them, with no time-integration or
   point-versus-area mismatch that a gauge reading would bring.

   What this fits is Windy's Z-R, not the ground truth — Windy derived its
   millimetres from reflectivity too. That is still worth having: it is a
   meteorological service's choice for this region rather than a constant
   picked from a textbook. */
function isLadder(L) { return !!(L.palette && L.palette.steps); }
function isRamp(L)   { return !!(L.palette && L.palette.ramp); }

function crossPairs() {
  var lad = LAYERS.filter(isLadder), ram = LAYERS.filter(isRamp);
  if (!lad.length || !ram.length) return [];
  var out = [];
  DIST.forEach(function (D, i) {
    var bestL = null, bestR = null;
    lad.forEach(function (L) {
      var t = L.cells[i];
      if (t && t.echo >= 3 && (!bestL || t.echo > bestL.echo)) bestL = t;
    });
    ram.forEach(function (L) {
      var t = L.cells[i];
      if (t && t.rN >= 3 && (!bestR || t.rN > bestR.rN)) bestR = t;
    });
    if (!bestL || !bestR) return;
    var st = districtStep(bestL);
    if (st < 2 || st > 10) return;              /* skip the noisy ends */
    var mm = districtRate(bestR);
    if (!(mm > 0.05)) return;
    out.push({ g:Math.round(mm * 100) / 100, d:stepDbz(st), n:D.name });
  });
  return out;
}

function zrPairs() { return store.get("zrPairs", []); }
function setZrPairs(v) { store.set("zrPairs", v); }

function fitLine(P) {
  var n = P.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  });
  var den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-9) return null;
  var b = (n * sxy - sx * sy) / den;
  return { b:b, la:(sy - b * sx) / n };
}

function fitZR() {
  var P = zrPairs().filter(function (p) { return p.g > 0 && p.d > 0; });
  if (P.length < 3) return null;
  /* One district where the two apps simply disagree — different radar, a few
     minutes apart — can swing a small sample completely. Fit once, drop the
     worst residuals, fit again. */
  if (P.length >= 8) {
    var f0 = fitLine(P);
    if (f0) {
      var res = P.map(function (p) {
        var x = Math.log(p.g) / Math.LN10;
        return Math.abs(p.d / 10 - (f0.la + f0.b * x));
      });
      var sorted = res.slice().sort(function (a, b) { return a - b; });
      var cut = sorted[Math.floor(sorted.length * 0.8)];
      var keep = P.filter(function (p, i) { return res[i] <= cut; });
      if (keep.length >= Math.max(3, P.length * 0.6)) P = keep;
    }
  }
  var n = P.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;   /* y = log10(Z) */
    sx += x; sy += y; sxx += x * x; sxy += x * y;
  });
  var den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-9) return null;
  var b = (n * sxy - sx * sy) / den;
  var la = (sy - b * sx) / n;
  if (!isFinite(b) || b <= 0.4 || b > 3) return null;
  /* R^2 */
  var mean = sy / n, ssTot = 0, ssRes = 0;
  P.forEach(function (p) {
    var x = Math.log(p.g) / Math.LN10, y = p.d / 10;
    var f = la + b * x;
    ssTot += (y - mean) * (y - mean); ssRes += (y - f) * (y - f);
  });
  var r2 = (ssTot > 0 ? 1 - ssRes / ssTot : 1);
  /* A fit is only usable if the two sources actually agree AND the slope is
     physically sensible. Published Z-R exponents sit between about 1.0 and 2.0;
     anything outside that means the scatter, not the rain, set the slope. */
  var ok = r2 >= 0.5 && b >= 0.8 && b <= 2.2;
  return { a:Math.pow(10, la), b:b, n:n, r2:r2, ok:ok };
}

function paintZR() {
  document.getElementById("zrA").value = ZR.a.toFixed(1);
  document.getElementById("zrB").value = ZR.b.toFixed(2);
  document.getElementById("zrCap").value = ZR.cap;
  var now = document.getElementById("zrNow");
  var eg = [27.5, 37.5, 47.5].map(function (dz) {
    return dz + "dBZ\u2192" + fmtRate(dbzToRate(dz));
  }).join("   ");
  now.textContent = "Z = " + ZR.a.toFixed(0) + "\u00b7R^" + ZR.b.toFixed(2)
    + "   \u00b7   " + eg + " mm/h";

  var bar = document.getElementById("zrPresets");
  bar.innerHTML = "";
  Object.keys(ZR_PRESETS).forEach(function (k) {
    var pz = ZR_PRESETS[k], btn = document.createElement("button");
    btn.className = "tool"; btn.textContent = pz.name;
    btn.setAttribute("aria-pressed", Math.abs(ZR.a - pz.a) < 1 && Math.abs(ZR.b - pz.b) < 0.01);
    btn.onclick = function () {
      ZR.a = pz.a; ZR.b = pz.b; saveZR(); paintZR(); render();
    };
    bar.appendChild(btn);
  });

  var h = document.getElementById("zrList"); h.innerHTML = "";
  var P = zrPairs();
  if (!P.length) {
    var e = document.createElement("div");
    e.className = "li"; e.style.color = "var(--dim)"; e.textContent = T("lyrEmpty");
    h.appendChild(e);
  }
  P.forEach(function (pr, i) {
    var d = document.createElement("div"); d.className = "li";
    d.innerHTML = "<span>" + pr.g + " mm/h @ " + pr.d + " dBZ</span>" +
      "<code>" + fmtRate(dbzToRate(pr.d)) + " " + T("mdlRate") + "</code>" +
      "<button class='x' aria-label='remove'>\u00d7</button>";
    d.querySelector(".x").onclick = function () {
      var q = zrPairs(); q.splice(i, 1); setZrPairs(q); paintZR();
    };
    h.appendChild(d);
  });
  var f = fitZR(), t = document.getElementById("zrFit");
  if (!f) {
    t.textContent = T("zrNeed"); t.style.color = "var(--dim)";
  } else {
    t.textContent = "n=" + f.n + "   a=" + f.a.toFixed(0) + "   b=" + f.b.toFixed(2)
      + "   R\u00b2=" + f.r2.toFixed(3) + (f.ok ? "" : "   \u2014 " + T("zrBadFit"));
    t.style.color = f.ok ? "var(--dim)" : "var(--red)";
  }
  document.getElementById("zrDoFit").disabled = !(f && f.ok);
}

document.getElementById("zrDone").onclick = function () { document.getElementById("zr").close(); };

  document.getElementById("zrG").value = ""; document.getElementById("zrD").value = "";
  paintZR();
};

  ZR.a = f.a; ZR.b = f.b; saveZR(); paintZR(); render();

};
document.getElementById("zrCross").onclick = function () {
  var cp = crossPairs();
  if (cp.length < 3) { toast(T("zrNoCross")); return; }
  var q = zrPairs();
  cp.forEach(function (c) { q.push({ g:c.g, d:c.d }); });
  setZrPairs(q.slice(-400));
  paintZR();
  toast(cp.length + " \u00d7");
};

};

};

/* paste / drop / pick */
document.getElementById("paste").onclick = function () {
  paintAnchorSel(); paintLayers();
  document.getElementById("dropHint").textContent =
    LAYERS.length ? T("another") : "";
  document.getElementById("cal").showModal();
  if (IMGC) { drawCal(); paintAnchors(); }
};
document.getElementById("calPick").onclick = function () { document.getElementById("calFile").click(); };
document.getElementById("calFile").onchange = function (e) {
  if (e.target.files && e.target.files.length) enqueueFiles(e.target.files);
  e.target.value = "";
};
document.addEventListener("paste", function (e) {
  var it = e.clipboardData && e.clipboardData.items; if (!it) return;
  var files = [];
  for (var i = 0; i < it.length; i++) {
    if (it[i].type.indexOf("image") === 0) {
      var f = it[i].getAsFile(); if (f) files.push(f);
    }
  }
  if (files.length) {
    paintAnchorSel();
    var dlg = document.getElementById("cal");
    if (!dlg.open) dlg.showModal();
    enqueueFiles(files);
    e.preventDefault();
  }
});
(function () {
  var dz = document.getElementById("calDrop");
  ["dragenter","dragover"].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove("over"); });
  });
  dz.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      enqueueFiles(e.dataTransfer.files);
    }
  });
})();

/* tap to place an anchor, with a loupe for precision */
(function () {
  var cv = document.getElementById("calCv");
  cv.addEventListener("pointerdown", function (e) {
    if (!IMGC) return;
    DRAG = true; cv.setPointerCapture(e.pointerId);
    drawLoupe(evtToImg(e)); e.preventDefault();
  });
  cv.addEventListener("pointermove", function (e) {
    if (!DRAG || !IMGC) return;
    drawLoupe(evtToImg(e)); e.preventDefault();
  });
  cv.addEventListener("pointerup", function (e) {
    if (!DRAG || !IMGC) return;
    DRAG = false;
    document.getElementById("loupe").style.display = "none";
    commitAnchor(evtToImg(e));
  });
  cv.addEventListener("pointercancel", function () {
    DRAG = false; document.getElementById("loupe").style.display = "none";
  });
})();

document.getElementById("calCoast").onclick = function () {

  this.setAttribute("aria-pressed", SHOWCOAST); drawCal();
};

document.getElementById("calX").onclick = closeCal;
document.getElementById("calDone").onclick = closeCal;
document.getElementById("cal").addEventListener("click", function (e) {
  if (e.target !== this) return;                 /* backdrop, not the panel */
  var r = this.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right ||
      e.clientY < r.top  || e.clientY > r.bottom) closeCal();
});

    b.className = "tool"; b.textContent = T("calSensL")[i];
    b.setAttribute("aria-pressed", i === SENSI);
    b.onclick = function () {

document.getElementById("fDump").onclick = function () {
  document.getElementById("io").value = FAVS.map(function (f) { return f.n + ", " + f.la + ", " + f.lo; }).join("\n");
};
document.getElementById("fLoad").onclick = function () {
  var out = [], bad = 0;
  document.getElementById("io").value.split(/\r?\n/).forEach(function (ln) {
    if (!ln.trim()) return;
    var p = ln.split(","), la = parseFloat(p[p.length-2]), lo = parseFloat(p[p.length-1]);
    var n = p.slice(0, -2).join(",").trim();
    if (n && isFinite(la) && isFinite(lo)) out.push({ n:n, la:la, lo:lo }); else bad++;
  });
  if (!out.length) { toast("×"); return; }
  FAVS = out; saveFavs(); paintList(); toast(out.length + (bad ? " / " + bad + "×" : ""));
};
document.getElementById("fReset").onclick = function () {
  FAVS = SEED.map(function (s) { return { n:s[0], la:s[1], lo:s[2] }; }); saveFavs(); paintList();
};

}
